<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="RayShield" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>RayShield logo, for light backgrounds</title>
  <defs>
    <linearGradient id="rs-g-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FDDF7"></stop>
      <stop offset="1" stop-color="#7C8CFF"></stop>
    </linearGradient>
    <mask id="rs-core-light">
      <rect width="64" height="64" fill="#fff"></rect>
      <rect x="17" y="17" width="30" height="30" rx="5" fill="#000"></rect>
    </mask>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#rs-g-light)" mask="url(#rs-core-light)"></rect>
  
  <text x="88" y="42" fill="#0B1220" font-family="Inter, 'Inter var', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="600" letter-spacing="-0.4">RayShield</text>
</svg>