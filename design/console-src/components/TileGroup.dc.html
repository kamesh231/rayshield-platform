<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <div style="margin-bottom:6px;font-size:11.5px;color:#93A0AF;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;">{{groupLabel}}</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#E4E8EC;border:1px solid #E4E8EC;border-radius:4px;overflow:hidden;">
    <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="3">
      <dc-import name="StatTile" label="{{tile.label}}" value="{{tile.value}}" window="{{tile.window}}" delta="{{tile.delta}}" delta-tone="{{tile.deltaTone}}" href="{{tile.href}}" hint-size="100%,90px"></dc-import>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:120},&quot;groupLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Core&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tiles&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,value:string,window:string,delta?:string,deltaTone?:string}[]&quot;}}"></script>
</body>
</html>
