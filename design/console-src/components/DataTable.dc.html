<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border:1px solid #E4E8EC;border-radius:4px;overflow:hidden;font-family:'IBM Plex Sans',sans-serif;">
  <div style="display:grid;grid-template-columns:repeat({{colCount}}, 1fr);padding:9px 16px;background:#F5F6F8;font-size:11.5px;color:#6B7686;font-weight:500;">
    <sc-for list="{{columns}}" as="col" hint-placeholder-count="4"><div>{{col}}</div></sc-for>
  </div>
  <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
    <div style="display:grid;grid-template-columns:repeat({{colCount}}, 1fr);padding:12px 16px;border-top:1px solid #E4E8EC;align-items:center;font-size:13.5px;color:#12161C;">
      <sc-for list="{{row}}" as="cell" hint-placeholder-count="4"><div>{{cell}}</div></sc-for>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:160},&quot;columns&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[][]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const columns = this.props.columns || [];
    return { columns, rows: this.props.rows || [], colCount: columns.length || 1 };
  }
}
</script>
</body>
</html>
