<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{isAllowed}}" hint-placeholder-val="{{true}}">
  <span style="display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#34D399;"><span style="width:6px;height:6px;border-radius:50%;background:#34D399;"></span>{{label}}</span>
</sc-if>
<sc-if value="{{isBlocked}}">
  <span style="display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#F0605F;"><span style="width:6px;height:6px;border-radius:50%;background:#F0605F;"></span>{{label}}</span>
</sc-if>
<sc-if value="{{isRecorded}}">
  <span style="display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#38BDF8;"><span style="width:6px;height:6px;border-radius:50%;background:#38BDF8;"></span>{{label}}</span>
</sc-if>
<sc-if value="{{isNeutral}}">
  <span style="display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#6B7686;"><span style="width:6px;height:6px;border-radius:50%;background:#6B7686;"></span>{{label}}</span>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:30},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;allowed&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;allowed&quot;,&quot;options&quot;:[&quot;allowed&quot;,&quot;blocked&quot;,&quot;recorded&quot;,&quot;neutral&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tone || 'neutral';
    return {
      label: this.props.label ?? t,
      isAllowed: t === 'allowed',
      isBlocked: t === 'blocked',
      isRecorded: t === 'recorded',
      isNeutral: t === 'neutral',
    };
  }
}
</script>
</body>
</html>
