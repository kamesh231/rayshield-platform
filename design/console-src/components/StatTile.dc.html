<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{hasHref}}" hint-placeholder-val="{{false}}">
  <a href="{{href}}" style="display:block;background:#fff;padding:16px 18px;font-family:'IBM Plex Sans',sans-serif;text-decoration:none;">
    <div style="font-size:12.5px;color:#6B7686;margin-bottom:6px;">{{label}} <span style="color:#93A0AF;">· {{window}}</span></div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;color:#0B0E12;">
      {{value}}
      <sc-if value="{{hasDelta}}">
        <sc-if value="{{isPositive}}"><span style="font-size:13px;font-weight:500;color:#157F4E;"> {{delta}}</span></sc-if>
        <sc-if value="{{isNegative}}"><span style="font-size:13px;font-weight:500;color:#C4293A;"> {{delta}}</span></sc-if>
        <sc-if value="{{isNeutralDelta}}"><span style="font-size:13px;font-weight:500;color:#6B7686;"> {{delta}}</span></sc-if>
      </sc-if>
    </div>
  </a>
</sc-if>
<sc-if value="{{hasNoHref}}" hint-placeholder-val="{{true}}">
  <div style="background:#fff;padding:16px 18px;font-family:'IBM Plex Sans',sans-serif;">
    <div style="font-size:12.5px;color:#6B7686;margin-bottom:6px;">{{label}} <span style="color:#93A0AF;">· {{window}}</span></div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;color:#0B0E12;">
      {{value}}
      <sc-if value="{{hasDelta}}">
        <sc-if value="{{isPositive}}"><span style="font-size:13px;font-weight:500;color:#157F4E;"> {{delta}}</span></sc-if>
        <sc-if value="{{isNegative}}"><span style="font-size:13px;font-weight:500;color:#C4293A;"> {{delta}}</span></sc-if>
        <sc-if value="{{isNeutralDelta}}"><span style="font-size:13px;font-weight:500;color:#6B7686;"> {{delta}}</span></sc-if>
      </sc-if>
    </div>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:90},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AI services detected&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;window&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;last 24h&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;delta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;deltaTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;positive&quot;,&quot;options&quot;:[&quot;positive&quot;,&quot;negative&quot;,&quot;neutral&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dt = this.props.deltaTone || 'neutral';
    return {
      label: this.props.label ?? '',
      value: this.props.value ?? '',
      window: this.props.window ?? 'last 24h',
      delta: this.props.delta,
      hasDelta: !!this.props.delta,
      isPositive: dt === 'positive',
      isNegative: dt === 'negative',
      isNeutralDelta: dt === 'neutral',
      href: this.props.href,
      hasHref: !!this.props.href,
      hasNoHref: !this.props.href,
    };
  }
}
</script>
</body>
</html>
