<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border:1px dashed #C3CBD3;border-radius:4px;padding:28px 20px;text-align:center;font-family:'IBM Plex Sans',sans-serif;">
  <div style="font-size:13.5px;color:#12161C;margin-bottom:4px;">{{headline}}</div>
  <sc-if value="{{hasSubline}}" hint-placeholder-val="{{false}}"><div style="font-size:12.5px;color:#93A0AF;">{{subline}}</div></sc-if>
  <sc-if value="{{hasAction}}" hint-placeholder-val="{{false}}"><a href="{{href}}" style="font-size:12.5px;color:#0F766E;">{{actionLabel}} →</a></sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:140},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;No AI activity observed in the last hour&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Widen the window&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      headline: this.props.headline ?? '',
      subline: this.props.subline,
      hasSubline: !!this.props.subline,
      actionLabel: this.props.actionLabel,
      hasAction: !!this.props.actionLabel,
      href: this.props.href || '#',
    };
  }
}
</script>
</body>
</html>
