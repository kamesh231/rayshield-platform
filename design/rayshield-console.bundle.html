<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RayShield Console</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading RayShield Console...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

color:{{ n.textFill }};font-weight:{{ n.weight }};font-size:12px;transition:background .3s\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ n.iconColor }};flex:none\">{{ n.icon }}<\u002Fspan><span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.label }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#9aa5b1;white-space:nowrap;flex:none\">{{ n.sub }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773;min-height:16px\">{{ graphHint }}<\u002Fdiv>\n          <sc-if value=\"{{ isLive }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;border-top:1px solid #e3e8ed;padding-top:8px\">\n              <div style=\"display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-bottom:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#4F5BD5;box-shadow:0 0 0 3px #ECEEFF\"><\u002Fspan>Live requests · refreshed every second<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px\">\n                <sc-for list=\"{{ liveHits }}\" as=\"lh\" hint-placeholder-count=\"0\">\n                  <div style=\"display:grid;grid-template-columns:64px 1fr auto;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ lh.color }};opacity:{{ lh.opacity }}\"><span>{{ lh.time }}<\u002Fspan><span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ lh.who }} → {{ lh.service }}<\u002Fspan><span style=\"color:#5b6773\">{{ lh.sensor }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- W5 AI services -->\ val=\"{{ false }}\"><button sc-camel-on-click=\"{{ pfToggleActive }}\" disabled=\"{{ readOnly }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220;color:{{ pfActiveColor }}\">{{ pfActiveLabel }}<\u002Fbutton><\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ closePolicy }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220\">Cancel<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ savePolicy }}\" disabled=\"{{ pfInvalid }}\" style=\"border:1px solid #4F5BD5;background:#4F5BD5;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500;opacity:{{ pfOpacity }}\">{{ pfSubmit }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n      <section style=\"background:#fff;border:1px solid #d5dce3;border-radius:6px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 90px minmax(0,1fr) 80px;gap:10px;padding:9px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;border-bottom:1px solid #e3e8ed\"><span>Policy<\u002Fspan><span>Rule<\u002Fspan><span>Mode<\u002Fspan><span>Applies to<\u002Fspan><span style=\"text-align:right\">Hits 24h<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ policyRows }}\" as=\"po\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ po.edit }}\" style=\"width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 90px minmax(0,1fr) 80px;gap:10px;align-items:center;border:0;border-bottom:1px solid #eef1f4;background:{{ po.bg }};cursor:pointer;padding:10px 14px;font-size:12.5px;color:{{ po.rowColor }}\">\n            <span style=\"display:flex;gap:8px;align-items:center;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">{{ po.name }}<\u002Fspan><sc-if value=\"{{ po.inactive }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid #d5dce3;border-radius:2px;padding:0 5px;color:#5b6773\">deactivated<\u002Fspan><\u002Fsc-if><\u002Fspan>\n            <span>{{ po.rule }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid {{ po.modeBorder }};color:{{ po.modeColor }};border-radius:2px;padding:1px 6px;width:fit-content\">{{ po.mode }}<\u002Fspan>\n            <span style=\"color:#5b6773\">{{ po.scopeLabel }}<\u002Fspan>\n            <span style=\"text-align:right;font-family:'JetBrains Mono',monospace\">{{ po.hits }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ noPolMatch }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:18px 14px;font-size:12.5px;color:#5b6773\">No policies match this search.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fsection>\n      <div style=\"margin-top:8px;font-size:12px;color:#5b6773\">Policies act on what a CUE already allows. Enforce cuts a match, Record logs it and lets it through. Neither can grant: a CUE is default-deny, so anything it does not list is already blocked. Status labels set in Discover feed block-prohibited-ai and unapproved-ai-record.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- CONTROL · CUEs list -->\n  <sc-if value=\"{{ isCues }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Control · CUEs\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px\">\n      <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;letter-spacing:.08em\">Control<\u002Fdiv><h1 style=\"font-family:'Space Grotesk',sans-serif;margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em\">CUEs<\u002Fh1><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\">\n        <span style=\"font-size:12px;color:#5b6773\">Group by<\u002Fspan>\n        <div style=\"display:flex;border:1px solid #d5dce3;border-radius:4px;padding:2px;background:#fff\"><button sc-camel-on-click=\"{{ cueGroupTool }}\" style=\"border:0;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:12px;background:{{ cgToolBg }};color:{{ cgToolColor }}\">Tool<\u002Fbutton><button sc-camel-on-click=\"{{ cueGroupRole }}\" style=\"border:0;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:12px;background:{{ cgRoleBg }};color:{{ cgRoleColor }}\">Group<\u002Fbutton><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ newCue }}\" disabled=\"{{ readOnly }}\" style=\"border:1px solid #4F5BD5;background:#4F5BD5;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500\">Generate CUE<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px;color:#5b6773;margin-bottom:14px;max-width:760px;line-height:1.5\">A CUE is the signed execution envelope for one tool, keyed by (tool, group). It lists egress, MCP servers, writable mounts, OS and packages, and blocks everything else. A device belongs to one group, so exactly one CUE resolves for any tool it runs.<\u002Fdiv>\n  <sc-if value=\"{{ cuePubBanner }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#ECEEFF;border:1px solid #C9CEFF;border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;color:#3E48B8;display:flex;gap:12px;align-items:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em\">PROPAGATING<\u002Fspan><span style=\"min-width:0\">{{ cuePubText }}<\u002Fspan><button sc-camel-on-click=\"{{ undoCuePub }}\" style=\"margin-left:auto;border:0;background:none;color:#4F5BD5;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap\">Undo · 10 min<\u002Fbutton><\u002Fdiv>\n  <\u002Fsc-if>\n    <div style=\"margin-bottom:10px\"><input value=\"{{ cueQ }}\" sc-camel-on-change=\"{{ setCueQ }}\" placeholder=\"Search tool, group, CUE ID, author or envelope row\" style=\"border:1px solid #d5dce3;border-radius:4px;padding:6px 10px;font-size:12.5px;width:360px;max-width:100%;box-sizing:border-box;background:#fff;color:#0B1220\"><\u002Fdiv>\n    <section style=\"background:#fff;border:1px solid #d5dce3;border-radius:6px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 56px 76px 64px 64px minmax(0,1.3fr) minmax(0,1.3fr);gap:10px;padding:9px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;border-bottom:1px solid #e3e8ed;background:#f8fafb\"><span>Tool<\u002Fspan><span>Group<\u002Fspan><span>Version<\u002Fspan><span>Signed<\u002Fspan><span style=\"text-align:right\">Running<\u002Fspan><span style=\"text-align:right\">Older ver.<\u002Fspan><span>Last published<\u002Fspan><span>Came from<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ cueGroups }}\" as=\"gr\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;gap:10px;align-items:baseline;padding:10px 14px 6px;border-bottom:1px solid #eef1f4\"><span style=\"font-size:13px;font-weight:600\">{{ gr.label }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#5b6773\">{{ gr.sub }}<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ gr.rows }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ c.open }}\" style=\"width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 56px 76px 64px 64px minmax(0,1.3fr) minmax(0,1.3fr);gap:10px;align-items:center;background:#fff;border:0;border-bottom:1px solid #eef1f4;padding:9px 14px;cursor:pointer;font-size:12.5px;color:{{ c.color }}\" style-hover=\"background:#f8fafb\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">{{ c.toolName }}<\u002Fspan>\n            <span>{{ c.roleName }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace\">{{ c.version }}<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ c.signColor }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ c.signColor }}\"><\u002Fspan>{{ c.signLabel }}<\u002Fspan>\n            <span style=\"text-align:right;font-family:'JetBrains Mono',monospace\">{{ c.running }}<\u002Fspan>\n            <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;color:{{ c.olderColor }}\">{{ c.older }}<\u002Fspan>\n            <span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">{{ c.pub }}<\u002Fspan> <span style=\"color:#5b6773\">· {{ c.by }}<\u002Fspan><\u002Fspan>\n            <span style=\"color:#4a5563;font-size:12px\">{{ c.how }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsc-for>\n    <\u002Fsection>\n    <sc-if value=\"{{ cueNoMatch }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:18px 14px;font-size:12.5px;color:#5b6773\">No CUEs match this search.<\u002Fdiv><\u002Fsc-if>\n    <div style=\"margin-top:8px;font-size:12px;color:#5b6773\">Retired CUEs stay in this list so audit records that cite them still resolve.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CONTROL · CUE detail -->\n  <sc-if value=\"{{ isCue }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Control · CUE detail\">\n    <button sc-camel-on-click=\"{{ goCues }}\" style=\"border:0;background:none;color:#4F5BD5;cursor:pointer;font-size:12px;padding:0;margin-bottom:8px\">← CUEs<\u002Fbutton>\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;letter-spacing:.08em\">Control · CUE<\u002Fdiv>\n        <h1 style=\"font-family:'Space Grotesk',sans-serif;margin:2px 0 4px;font-size:20px;font-weight:600;letter-spacing:-.01em\">{{ cd.tool }} · {{ cd.roleName }}<\u002Fh1>\n        <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">{{ cd.ref }}<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ cd.signColor }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ cd.signColor }}\"><\u002Fspan>{{ cd.signLabel }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:center\">\n        <button sc-camel-on-click=\"{{ cueBlast }}\" style=\"display:none;border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220\">View blast radius<\u002Fbutton>\n        <sc-if value=\"{{ cd.active }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ toggleRetire }}\" disabled=\"{{ readOnly }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220;color:#C4293A\">Retire<\u002Fbutton><button sc-camel-on-click=\"{{ cueEdit }}\" disabled=\"{{ readOnly }}\" style=\"border:1px solid #4F5BD5;background:#4F5BD5;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500\">Edit · creates {{ cd.nextV }}<\u002Fbutton><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <sc-if value=\"{{ cuePubBanner }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#ECEEFF;border:1px solid #C9CEFF;border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;color:#3E48B8;display:flex;gap:12px;align-items:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em\">PROPAGATING<\u002Fspan><span style=\"min-width:0\">{{ cuePubText }}<\u002Fspan><button sc-camel-on-click=\"{{ undoCuePub }}\" style=\"margin-left:auto;border:0;background:none;color:#4F5BD5;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap\">Undo · 10 min<\u002Fbutton><\u002Fdiv>\n  <\u002Fsc-if>\n    <sc-if value=\"{{ cd.unsigned }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#FDF1E4;border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;color:#8a4207\">aegis exec generated this CUE from the shipped default on first run, and it has not been signed. Review the envelope and publish it to sign.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ retireOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"background:#fff;border:1px solid #e3b7bc;border-radius:6px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:13px;font-weight:600\">Retire {{ cd.ref }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.5\">{{ retireText }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.5;color:#4a5563\">{{ retireConsequence }}<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end\"><button sc-camel-on-click=\"{{ toggleRetire }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220\">Cancel<\u002Fbutton><sc-if value=\"{{ retireBlocked }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ showCueEps }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220\">Show endpoints<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ retireAllowed }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ doRetire }}\" style=\"border:1px solid #C4293A;background:#C4293A;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500\">Retire CUE<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n    <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:#e3e8ed;border:1px solid #d5dce3;border-radius:6px;overflow:hidden;margin-bottom:12px\">\n      <div style=\"background:#fff;padding:10px 12px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Endpoints running<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600\">{{ cd.running }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;padding:10px 12px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">On older version<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;color:{{ cd.olderColor }}\">{{ cd.older }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;padding:10px 12px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Last published<\u002Fdiv><div style=\"font-size:12.5px;margin-top:3px\">{{ cd.pub }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;padding:10px 12px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Came from<\u002Fdiv><div style=\"font-size:12.5px;margin-top:3px\">{{ cd.how }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;padding:10px 12px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">OS · packages<\u002Fdiv><div style=\"font-size:12px;margin-top:3px;font-family:'JetBrains Mono',monospace\">{{ cd.runtime }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"background:#fff;border:1px solid #d5dce3;border-radius:6px;overflow:hidden;margin-bottom:12px\">\n      <header style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #e9edf1\">\n        <div><span style=\"font-size:13px;font-weight:600\">Envelope<\u002Fspan><span style=\"font-size:12px;color:#5b6773;margin-left:10px\">Default-deny. Anything not listed is blocked. Policies can cut or record a listed row; they cannot add one.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px\"><sc-for list=\"{{ cd.origins }}\" as=\"o\" hint-placeholder-count=\"3\"><span style=\"display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:#4a5563\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;border:1px {{ o.originStyle }} {{ o.originBorder }};background:{{ o.originBg }};border-radius:2px;padding:0 6px\">{{ o.originLabel }}<\u002Fspan>{{ o.n }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n      <\u002Fheader>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) 120px 56px minmax(0,1.6fr);gap:10px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;border-bottom:1px solid #e3e8ed;background:#f8fafb\"><span>Allows<\u002Fspan><span>Detail<\u002Fspan><span>Origin<\u002Fspan><span>Since<\u002Fspan><span>Source<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ cd.secs }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"padding:10px 14px 4px;display:flex;gap:8px;align-items:baseline\"><span style=\"font-size:12.5px;font-weight:600\">{{ s.title }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#5b6773\">{{ s.count }}<\u002Fspan><span style=\"font-size:11.5px;color:#9aa5b1\">{{ s.sub }}<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ s.rows }}\" as=\"r\" hint-placeholder-count=\"2\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) 120px 56px minmax(0,1.6fr);gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid #f1f3f5;font-size:12.5px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;min-width:0;overflow-wrap:anywhere\">{{ r.value }}<\u002Fspan>\n            <span style=\"color:#4a5563;min-width:0\">{{ r.detail }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;border:1px {{ r.originStyle }} {{ r.originBorder }};background:{{ r.originBg }};border-radius:2px;padding:1px 6px;width:fit-content;white-space:nowrap\">{{ r.originLabel }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#5b6773\">{{ r.since }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#5b6773;min-width:0\">{{ r.ref }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ s.empty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:4px 14px 10px;font-size:12px;color:#9aa5b1\">None listed, so all are blocked.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fsection>\n    <section style=\"background:#fff;border:1px solid #d5dce3;border-radius:6px;overflow:hidden\">\n      <header style=\"padding:10px 14px;border-bottom:1px solid #e9edf1\"><span style=\"font-size:13px;font-weight:600\">Version history<\u002Fspan><span style=\"font-size:12px;color:#5b6773;margin-left:10px\">Each version is a separate signed artifact. Earlier versions are never changed.<\u002Fspan><\u002Fheader>\n      <sc-for list=\"{{ cd.hist }}\" as=\"v\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:56px 110px minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #f1f3f5;font-size:12.5px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;display:flex;gap:6px;align-items:center\">{{ v.vLabel }}<sc-if value=\"{{ v.live }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:#157F4E\">live<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#5b6773\">{{ v.date }}<\u002Fspan>\n          <span>{{ v.by }}<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">{{ v.change }}<\u002Fspan>\n          <span style=\"color:#5b6773;font-size:12px\">{{ v.via }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CONTROL · Generate CUE -->\n  <sc-if value=\"{{ isCueGen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Control · Generate CUE\">\n    <button sc-camel-on-click=\"{{ genExit }}\" style=\"border:0;background:none;color:#4F5BD5;cursor:pointer;font-size:12px;padding:0;margin-bottom:8px\">{{ genExitLabel }}<\u002Fbutton>\n    <div style=\"margin-bottom:12px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;letter-spacing:.08em\">Control · CUEs<\u002Fdiv>\n      <h1 style=\"font-family:'Space Grotesk',sans-serif;margin:2px 0 4px;font-size:20px;font-weight:600;letter-spacing:-.01em\">{{ genTitle }}<\u002Fh1>\n      <div style=\"font-size:12.5px;color:#5b6773;max-width:720px;line-height:1.5\">{{ genSub }}<\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"background:#fff;border:1px solid #d5dce3;border-radius:6px\">\n      <header style=\"display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid #e9edf1\">\n        <sc-for list=\"{{ genSteps }}\" as=\"is\" hint-placeholder-count=\"6\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ is.color }};display:flex;gap:6px;align-items:center\"><span style=\"width:16px;height:16px;border-radius:50%;border:1px solid {{ is.color }};background:{{ is.bg }};color:{{ is.numColor }};display:inline-flex;align-items:center;justify-content:center;font-size:9.5px\">{{ is.n }}<\u002Fspan>{{ is.label }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fheader>\n      <div style=\"padding:14px\">\n        <sc-if value=\"{{ genAt1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-bottom:8px\">Which tool does this CUE govern?<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px\">\n            <sc-for list=\"{{ genTools }}\" as=\"t\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ t.pick }}\" style=\"text-align:left;background:{{ t.bg }};border:1px solid {{ t.border }};border-radius:4px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:#0B1220\"><span style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500\">{{ t.name }}<\u002Fspan><span style=\"font-size:12px;color:#5b6773\">{{ t.vendor }}<\u002Fspan><\u002Fspan><span style=\"font-size:12px;color:#5b6773\">{{ t.held }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9aa5b1;line-height:1.5\">default · {{ t.defaults }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ genAt2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-bottom:8px\">Which group holds it?<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n            <sc-for list=\"{{ genRoles }}\" as=\"r\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ r.pick }}\" style=\"text-align:left;background:{{ r.bg }};border:1px solid {{ r.border }};border-radius:4px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:#0B1220\"><span style=\"font-size:12.5px;font-weight:500\">{{ r.name }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:{{ r.noteColor }}\">{{ r.note }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ genConflict }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px;background:#FDF1E4;border-radius:4px;padding:10px 12px;font-size:12.5px;color:#8a4207;display:flex;gap:12px;align-items:center\">{{ genConflictText }}<button sc-camel-on-click=\"{{ genEditExisting }}\" style=\"margin-left:auto;border:1px solid #B4530A;background:#fff;color:#B4530A;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px;white-space:nowrap\">{{ genConflictCta }}<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ genAt3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12px;color:#5b6773;margin-bottom:10px\">{{ genPrefill }} Anything not listed is blocked.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-for list=\"{{ genSecs }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"border:1px solid #e3e8ed;border-radius:4px;overflow:hidden\">\n                <div style=\"display:flex;gap:8px;align-items:baseline;padding:8px 12px;background:#f8fafb;border-bottom:1px solid #e3e8ed\"><span style=\"font-size:12.5px;font-weight:600\">{{ s.title }}<\u002Fspan><span style=\"font-size:11.5px;color:#5b6773\">{{ s.sub }}<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ s.rows }}\" as=\"r\" hint-placeholder-count=\"2\">\n                  <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) 120px 52px 70px;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid #f1f3f5;font-size:12.5px;opacity:{{ r.rowOpacity }}\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;text-decoration:{{ r.strike }};min-width:0;overflow-wrap:anywhere\">{{ r.value }}<\u002Fspan>\n                    <span style=\"color:#4a5563;min-width:0\">{{ r.detail }}<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;border:1px {{ r.originStyle }} {{ r.originBorder }};background:{{ r.originBg }};border-radius:2px;padding:1px 6px;width:fit-content;white-space:nowrap\">{{ r.originLabel }}<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773\">{{ r.since }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ r.toggle }}\" style=\"border:0;background:none;cursor:pointer;font-size:12px;color:{{ r.actColor }};padding:0;text-align:right\">{{ r.act }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;gap:8px;padding:8px 12px\">\n                  <sc-if value=\"{{ s.isText }}\" hint-placeholder-val=\"{{ true }}\"><input value=\"{{ s.addValue }}\" sc-camel-on-change=\"{{ s.setAdd }}\" placeholder=\"{{ s.placeholder }}\" style=\"flex:1;border:1px solid #d5dce3;border-radius:2px;padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:12px;background:#fff\"><\u002Fsc-if>\n                  <sc-if value=\"{{ s.isSelect }}\" hint-placeholder-val=\"{{ false }}\"><sc-raw-select sc-camel-on-change=\"{{ s.setAdd }}\" style=\"flex:1;border:1px solid #d5dce3;border-radius:2px;padding:5px 8px;font-size:12px;background:#fff\"><sc-for list=\"{{ s.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\" selected=\"{{ o.selected }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-if>\n                  <button sc-camel-on-click=\"{{ s.doAdd }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220;padding:5px 12px;font-size:12px\">Add<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ genAt4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px\">\n            <div>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-bottom:6px\">Checks<\u002Fdiv>\n              <sc-for list=\"{{ genChecks }}\" as=\"c\" hint-placeholder-count=\"4\"><div style=\"display:grid;grid-template-columns:54px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid #f1f3f5;font-size:12.5px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:{{ c.color }}\">{{ c.result }}<\u002Fspan><span>{{ c.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-bottom:6px\">{{ genDiffHead }}<\u002Fdiv>\n              <sc-for list=\"{{ genDiffRows }}\" as=\"df\" hint-placeholder-count=\"2\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:4px 8px;background:{{ df.bg }};color:{{ df.color }};border-radius:2px;margin-bottom:3px\">{{ df.text }}<\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ genAt5 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px\"><span style=\"font-size:13px;font-weight:600\">{{ genReachLine }}<\u002Fspan><button sc-camel-on-click=\"{{ genOpenGraph }}\" style=\"border:0;background:none;color:#4F5BD5;cursor:pointer;font-size:12px;padding:0\">Open draft in blast radius graph<\u002Fbutton><\u002Fdiv>\n          <div style=\"font-size:12px;color:#5b6773;margin-bottom:10px\">What this draft would let the agent reach, before anything is signed. Uses the policies currently applied in Blast radius.<\u002Fdiv>\n          <sc-for list=\"{{ genReach }}\" as=\"r\" hint-placeholder-count=\"2\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1.6fr);gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f3f5;font-size:12.5px\"><span style=\"font-weight:600\">{{ r.asset }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ r.color }}\">{{ r.state }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773\">{{ r.via }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ genNoReach }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:#5b6773\">Neither the live CUEs nor this draft let this group reach a critical asset.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ genAt6 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:12.5px\">\n            <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Signed as<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;margin-top:3px\">{{ genPubRef }}<\u002Fdiv><div style=\"font-size:11.5px;color:#5b6773;margin-top:2px\">server key 7F3A…C21E<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Push<\u002Fdiv><div style=\"margin-top:3px\">Queued to {{ genPubEps }} endpoints<\u002Fdiv><div style=\"font-size:11.5px;color:#5b6773;margin-top:2px\">picked up on next check-in, usually within 2 minutes<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Undo<\u002Fdiv><div style=\"margin-top:3px\">10 minutes after publishing<\u002Fdiv><div style=\"font-size:11.5px;color:#5b6773;margin-top:2px\">restores the previous signed version<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #e9edf1\">\n          <button sc-camel-on-click=\"{{ genBack }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220\">{{ genBackLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ genNotLast }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ genNext }}\" disabled=\"{{ genCanNext }}\" style=\"border:1px solid #4F5BD5;background:#4F5BD5;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500;opacity:{{ genNextOpacity }}\">{{ genNextLabel }}<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ genAt6 }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ genPublish }}\" disabled=\"{{ readOnly }}\" style=\"border:1px solid #4F5BD5;background:#4F5BD5;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500\">Publish and sign<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CONTROL · Blast radius -->\n  <sc-if value=\"{{ isBlast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;letter-spacing:.08em\">Control<\u002Fdiv>\n        <h1 style=\"font-family:'Space Grotesk',sans-serif;margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em\">Blast radius<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:center\">\n        <input value=\"{{ blastQuery }}\" sc-camel-on-change=\"{{ setBlastQuery }}\" placeholder=\"Find a group, grant or asset\" style=\"border:1px solid #d5dce3;border-radius:2px;padding:6px 8px;font-size:12.5px;width:220px;background:#fff\">\n        <label style=\"display:flex;gap:6px;align-items:center;font-size:12px;color:#5b6773;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ blastInactive }}\" sc-camel-on-change=\"{{ toggleBlastInactive }}\">Include deactivated<\u002Flabel>\n        <button sc-camel-on-click=\"{{ blastImport }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220\">Generate CUE<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px;color:#5b6773;margin-bottom:14px;max-width:720px;line-height:1.5\">What a group can reach, computed from three inputs: the group, the CUE versions it holds (one per tool), and the policies that cut or record paths. Select any node to trace paths through it.<\u002Fdiv>\n\n    <section style=\"background:#fff;border:1px solid #d5dce3;border-radius:6px;padding:12px 14px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2.2fr);gap:16px;align-items:start\">\n      <label style=\"display:flex;flex-direction:column;gap:5px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">1 · Group r;gap:6px\"><svg width=\"22\" height=\"6\"><line x1=\"0\" y1=\"3\" x2=\"22\" y2=\"3\" stroke=\"#22B8D8\" stroke-width=\"1.5\"><\u002Fline><\u002Fsvg>recorded by a Record policy<\u002Fspan>\n          <span>Choke-point ranking needs grant-condition data from CUE, so it is not computed yet.<\u002Fspan>\n          <button sc-camel-on-click=\"{{ clearBlast }}\" style=\"margin-left:auto;border:0;background:none;color:#4F5BD5;cursor:pointer;font-size:12px;font-family:'IBM Plex Sans',sans-serif\">Clear selection<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <aside style=\"flex:1 1 280px;min-width:0;background:#fff;border:1px solid #d5dce3;border-radius:6px;position:sticky;top:20px\">\n        <header style=\"padding:12px 14px;border-bottom:1px solid #e9edf1\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">{{ bSelKind }}<\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin-top:2px\">{{ bSelName }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#5b6773;margin-top:4px;line-height:1.45\">{{ bSelSummary }}<\u002Fdiv>\n        <\u002Fheader>\n        <div style=\"padding:12px 14px\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px\">\n            <div style=\"background:#f8fafb;border-radius:3px;padding:6px 8px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Open<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600\">{{ bOpenN }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#f8fafb;border-radius:3px;padding:6px 8px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Cut<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-s eNoCues }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#5b6773\">No agent, so no CUE is in force.<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ de.behind }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:10px;font-size:12px;color:#B4530A;line-height:1.45\">Running an older CUE version. Rows added since then are blocked here; rows removed since then are still allowed.<\u002Fdiv><\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ pushBundle }}\" disabled=\"{{ readOnly }}\" style=\"border:1px solid #4F5BD5;background:#4F5BD5;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:500;width:100%;margin-top:12px\">{{ pushLabel }}<\u002Fbutton>\n        <\u002Fsection>\n        <section style=\"background:#fff;border:1px solid #e3e8ed;border-radius:6px;padding:12px 14px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-bottom:8px\">Policies on this endpoint<\u002Fdiv>\n          <sc-for list=\"{{ dePolicies }}\" as=\"po\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid #e3e8ed;font-size:12px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">{{ po.name }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#5b6773;text-transform:uppercase;letter-spacing:.04em\">{{ po.mode }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n          <button sc-camel-on-click=\"{{ goRoles }}\" style=\"border:0;background:none;color:#4F5BD5;cursor:pointer;font-size:12px;padding:0;margin-top:10px\">Edit policies in Control<\u002Fbutton>\n        <\u002Fsection>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- PROTECT · Detections (family overview) -->\n  <sc-if value=\"{{ isDetections }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Protect · Detections\" style=\"color:#0B1220\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px\">\n      <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5b6773\">Protect<\u002Fdiv><h1 style=\"font-family:'Space Grotesk',sans-serif;margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em;color:#0B1220\">Detections<\u002Fh1><div style=\"font-size:12.5px;color:#5b6773;max-width:640px;line-height:1.5;margin-top:4px\">Deterministic, rule-tagged findings from the execution engine, grouped by rule family and mapped to OWASP Agentic. Severity is what it is; disposition is what we did about it — two separate axes.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;border:1px solid #d5dce3;border-radius:4px;background:#fff;padding:2px\"><sc-for list=\"{{ dxWins }}\" as=\"wn\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ wn.select }}\" style=\"border:0;border-radius:3px;padding:5px 11px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:{{ wn.bg }};color:{{ wn.color }}\">{{ wn.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px\">\n      <sc-for list=\"{{ detTiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;border:1px solid #e3e8ed;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">{{ t.label }}<\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.02em;color:{{ t.color }}\">{{ t.value }}<\u002Fspan>\n · grp<\u002Fspan><span>Disposition<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ famRows }}\" as=\"f\" hint-placeholder-count=\"9\">\n        <button sc-camel-on-click=\"{{ f.open }}\" style=\"width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1.6fr) 96px 108px 52px 104px minmax(0,1.35fr);gap:10px;align-items:center;background:transparent;border:0;border-bottom:1px solid #e3e8ed;padding:11px 14px;cursor:pointer;color:#0B1220\" style-hover=\"background:#f8fafb\">\n          <span style=\"min-width:0\"><span style=\"font-size:13.5px;font-weight:500;color:#0B1220\">{{ f.label }}<\u002Fspan><span style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9aa5b1\">{{ f.ruleId }}<\u002Fspan><sc-if value=\"{{ f.isUndisclosed }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-block;margin-top:3px;font-size:10px;font-family:'JetBrains Mono',monospace;color:#8A4B08;border:1px solid #E7C795;background:#FBEFDD;border-radius:2px;padding:0 5px\">declared vs observed<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <span><span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:{{ f.sevColor }};background:{{ f.sevBg }};border-radius:2px;padding:2px 7px\">{{ f.sevLabel }}<\u002Fspan><\u002Fspan>\n          <span style=\"min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#0B1220\">{{ f.owasp }}<\u002Fspan><span style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#5b6773\">{{ f.obs }}<\u002Fspan><\u002Fspan>\n          <span style=\"text-align:right;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;color:#0B1220\">{{ f.hits }}<\u002Fspan>\n          <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#4a5563\">{{ f.devices }} · {{ f.groups }}<\u002Fspan>\n          <span style=\"display:flex;gap:5px;flex-
