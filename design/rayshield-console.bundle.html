nd:#eef1f4;overflow:hidden\"><span style=\"display:block;height:6px;width:{{ p.barPct }};background:#0B5A61\"><\u002Fspan><\u002Fspan><span style=\"display:flex;align-items:flex-end;gap:1px;height:16px;margin-top:5px\"><sc-for list=\"{{ p.spark }}\" as=\"v\" hint-placeholder-count=\"20\"><span style=\"flex:1;background:#0B5A61;opacity:.45;height:{{ v.h }}px;border-radius:0.5px\"><\u002Fspan><\u002Fsc-for><\u002Fspan>\n            <div style=\"display:flex;gap:10px;margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9aa5b1\"><span>{{ p.sessions }} sessions<\u002Fspan><span>{{ p.io }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- USAGE · Budgets -->\n  <sc-if value=\"{{ isBudgets }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Usage · Budgets\" style=\"color:#0B1220\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px\">\n      <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5b6773\">Usage<\u002Fdiv><h1 style=\"font-family:'Space Grotesk',sans-serif;margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em;color:#0B1220\">Budgets<\u002Fh1><\u002Fdiv>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#8A4B08;background:#FBEFDD;border:1px solid #E7C795;border-radius:2px;padding:3px 8px;white-space:nowrap\">Prices illustrative<\u002Fspan>\n    <\u002Fdiv>\n    <section style=\"background:#FCF1F1;border:1px solid #F1C7C7;border-radius:6px;padding:14px 16px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#B42318;border-radius:2px;padding:3px 7px;white-space:nowrap;margin-top:2px\">Enforcement<\u002Fspan>\n      <div style=\"min-width:0\">\n        <div style=\"font-size:14.5px;color:#0B1220;line-height:1.5\"><strong style=\"font-family:'Space Grotesk',sans-serif;font-weight:600\">{{ budgetStopPct }}% of sessions were cut mid-run<\u002Fstrong> — {{ budgetTotalStops }} of {{ budgetSessions }}. When a session crosses its cap the engine returns a <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#B42318\">429<\u002Fspan> and the run stops.<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#5b6773;line-height:1.5;margin-top:5px\">A budget hard-stop is an enforcement action — the same class of event as a blocked egress — not a billing line. Below: each group's cap against consumption, and the stops that actually fired.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background:#fff;border:1px solid #e3e8ed;border-radius:6px;overflow:hidden;margin-bottom:16px\">\n      <header style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #e3e8ed;gap:12px;flex-wrap:wrap\">\n        <span style=\"font-size:13px;font-weight:600;color:#0B1220\">Caps &amp; consumption<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#9aa5b1\">Sort<\u002Fspan><div style=\"display:flex;border:1px solid #d5dce3;border-radius:4px;padding:2px\"><button sc-camel-on-click=\"{{ sortByStops }}\" style=\"border:0;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:12px;background:{{ sortStopsBg }};color:{{ sortStopsColor }}\">Stops<\u002Fbutton><button sc-camel-on-click=\"{{ sortBySpend }}\" style=\"border:0;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:12px;background:{{ sortSpendBg }};color:{{ sortSpendColor }}\">Spend<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <\u002Fheader>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) 96px 110px;gap:12px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;border-bottom:1px solid #e3e8ed\"><span>Group<\u002Fspan><span>Avg / user vs cap<\u002Fspan><span style=\"text-align:right\">Spend<\u002Fspan><span style=\"text-align:right\">Stops<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ budgetRows }}\" as=\"g\" hint-placeholder-count=\"9\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) 96px 110px;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid #e3e8ed;font-size:12.5px\">\n          <span style=\"min-width:0\"><span style=\"color:#0B1220;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ g.group }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#5b6773\">{{ g.cap }}<\u002Fspan><span style=\"display:flex;align-items:flex-end;gap:1px;height:14px;margin-top:5px\"><sc-for list=\"{{ g.spark }}\" as=\"v\" hint-placeholder-count=\"20\"><span style=\"flex:1;background:#B42318;opacity:.4;height:{{ v.h }}px;border-radius:0.5px\"><\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fspan>\n          <span style=\"min-width:0\"><span style=\"position:relative;display:block;height:8px;border-radius:2px;background:#eef1f4;overflow:hidden\"><span style=\"display:block;height:8px;width:{{ g.avgPct }};background:#7c8896\"><\u002Fspan><\u002Fspan><div style=\"display:flex;justify-content:space-between;margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9aa5b1\"><span>{{ g.avg }} avg<\u002Fspan><span>cap {{ g.cap }}<\u002Fspan><\u002Fdiv><\u002Fspan>\n          <span style=\"text-align:right\"><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;display:block\">{{ g.cost }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#9aa5b1\">{{ g.spendRank }}<\u002Fspan><\u002Fspan>\n          <span style=\"text-align:right\"><span style=\"display:inline-flex;align-items:baseline;gap:5px;justify-content:flex-end\"><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:#B42318\">{{ g.stops }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#9aa5b1\">{{ g.stopRank }}<\u002Fspan><\u002Fspan><span style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:#9aa5b1\">{{ g.per100 }} / 100 sess<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"padding:12px 14px;font-size:12.5px;color:#5b6773;line-height:1.5;background:#FAFBFC\">Spend and friction rank differently. The tightest caps sit on <strong style=\"color:#0B1220\">Contractor · Eng<\u002Fstrong>, <strong style=\"color:#0B1220\">Customer Support<\u002Fstrong> and <strong style=\"color:#0B1220\">Marketing<\u002Fstrong> — low spenders that hit the wall hardest. Sort by spend and the groups whose people are stopped every day drop down the list. Sort by stops to see them.<\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background:#fff;border:1px solid #e3e8ed;border-radius:6px;overflow:hidden\">\n      <header style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #e3e8ed\"><span style=\"font-size:13px;font-weight:600;color:#0B1220\">Hard-stops that fired<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773\">where the cap cut the run<\u002Fspan><\u002Fheader>\n      <sc-for list=\"{{ stopRows }}\" as=\"e\" hint-placeholder-count=\"6\">\n        <div style=\"padding:12px 14px;border-bottom:1px solid #e3e8ed\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px\">\n            <span style=\"min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#0B1220\">{{ e.person }}<\u002Fspan> <span style=\"font-size:11.5px;color:#5b6773\">· {{ e.group }}<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;gap:10px;align-items:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#8A4B08;background:#FBEFDD;border:1px solid #E7C795;border-radius:2px;padding:1px 6px\">{{ e.scope }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9aa5b1\">{{ e.when }}<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-end;gap:1.5px;height:18px\">\n            <sc-for list=\"{{ e.ticks }}\" as=\"t\" hint-placeholder-count=\"20\">\n              <sc-if value=\"{{ t.stop }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex:1;min-width:2px;height:18px;background:#B42318;border-radius:1px\"><\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ t.done }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"flex:1;min-width:2px;height:11px;background:#4F5BD5;border-radius:1px\"><\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ t.cut }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex:1;min-width:2px;height:11px;background:#e6e9ed;border-radius:1px\"><\u002Fspan><\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;margin-top:6px;flex-wrap:wrap\">\n            <span style=\"font-size:12px;color:#B42318;font-family:'JetBrains Mono',monospace\">429 · stopped at {{ e.stopLabel }} · {{ e.cut }} turns cut<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773\">{{ e.spendAt }} against {{ e.cap }} cap · session {{ e.sid }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- PROTECT · Session detail -->\n  <sc-if value=\"{{ isSession }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Protect · Session detail\" style=\"color:#0B1220\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px\">\n      <div style=\"min-width:0\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5b6773\">Protect · Execution<\u002Fdiv><div style=\"display:flex;align-items:center;gap:10px;margin-top:3px;flex-wrap:wrap\"><h1 style=\"font-family:'Space Grotesk',sans-serif;margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;color:#0B1220\">Session {{ sessId }}<\u002Fh1><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:{{ sessOutcome.color }};background:{{ sessOutcome.bg }};border:1px solid {{ sessOutcome.bd }};border-radius:2px;padding:2px 8px\">{{ sessOutcome.label }}<\u002Fspan><\u002Fdiv><div style=\"font-size:12.5px;color:#5b6773;margin-top:4px\">What this agent actually did, boot to last event — read top to bottom.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n        <sc-for list=\"{{ sessOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ o.select }}\" style=\"text-align:left;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.color }};border-radius:4px;padding:6px 10px;cursor:pointer\"><div style=\"font-size:12px;font-weight:500\">{{ o.label }}<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#5b6773\">{{ o.sub }}<\u002Fdiv><\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ORIGIN -->\n    <section style=\"background:#fff;border:1px solid #e3e8ed;border-radius:6px;overflow:hidden;margin-bottom:12px\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)\">\n        <div style=\"padding:14px;border-right:1px solid #e3e8ed;min-width:0\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-bottom:6px\">Initial prompt<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#0B1220;line-height:1.5\">“{{ origin.initial_prompt }}”<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:14px\">\n            <sc-for list=\"{{ sessMeta }}\" as=\"m\" hint-placeholder-count=\"4\"><div style=\"min-width:0\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">{{ m.k }}<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#0B1220;word-break:break-all\">{{ m.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:14px;background:#FAFBFC;min-width:0\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-bottom:8px\">At boot the CUE permitted · {{ bootCount }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <sc-for list=\"{{ boot }}\" as=\"b\" hint-placeholder-count=\"4\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px\"><span style=\"color:#4a5563\">{{ b.label }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#0B1220;background:#fff;border:1px solid #e3e8ed;border-radius:2px;padding:1px 8px\">{{ b.count }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#9aa5b1;margin-top:10px;line-height:1.45\">Everything below happened inside this envelope. Anything outside it was blocked.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FEED -->\n    <section style=\"background:#fff;border:1px solid #e3e8ed;border-radius:6px;overflow:hidden\">\n      <header style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #e3e8ed\"><span style=\"font-size:13px;font-weight:600;color:#0B1220\">Activity<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773\">{{ feedSummary }}<\u002Fspan><\u002Fheader>\n      <div style=\"padding:4px 14px 14px\">\n        <sc-for list=\"{{ feed }}\" as=\"r\" hint-placeholder-count=\"12\">\n          <div style=\"display:grid;grid-template-columns:62px 16px minmax(0,1fr);gap:10px;align-items:stretch\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9aa5b1;text-align:right;padding-top:11px\">{{ r.time }}<\u002Fspan>\n            <span style=\"position:relative\"><span style=\"position:absolute;left:7px;top:0;bottom:0;width:1px;background:#e9edf1\"><\u002Fspan><span style=\"position:absolute;left:3px;top:10px;width:9px;height:9px;border-radius:50%;background:{{ r.dotColor }};border:2px solid #fff;box-sizing:border-box\"><\u002Fspan><\u002Fspan>\n            <div style=\"min-width:0;padding:6px 0\">\n              <sc-if value=\"{{ r.tailStart }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#9aa5b1;margin:2px 0 8px\">Sandbox teardown after stop<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ r.isGroup }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;gap:9px;align-items:baseline;opacity:{{ r.dimOpacity }}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:{{ r.catColor }};min-width:78px\">{{ r.count }} × {{ r.catLabel }}<\u002Fspan><span style=\"font-size:12.5px;color:#5b6773;min-width:0;line-height:1.45\">{{ r.summary }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.isSingle }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;gap:9px;align-items:baseline;opacity:{{ r.dimOpacity }}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:{{ r.catColor }};min-width:78px\">{{ r.catLabel }}<\u002Fspan><span style=\"min-width:0\"><span style=\"font-size:12.5px;color:#0B1220\">{{ r.label }}<\u002Fspan> <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9aa5b1\">{{ r.detail }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.isDetection }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px solid #F1C7C7;background:#FCF1F1;border-radius:5px;padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#B42318;border-radius:2px;padding:2px 7px\">Detection<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#0B1220\">{{ r.label }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;color:{{ r.sevColor }};background:{{ r.sevBg }};border-radius:2px;padding:2px 7px\">{{ r.sev }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773\">{{ r.owasp }}<\u002Fspan><span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#B42318\">blocked<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.isBlock }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px solid #F1C7C7;background:#FCF1F1;border-radius:5px;padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text- ppercase;letter-spacing:.04em;color:{{ pOutcome.color }};background:{{ pOutcome.bg }};border:1px solid {{ pOutcome.bd }};border-radius:2px;padding:2px 8px\">{{ pOutcome.label }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#0B1220;margin-top:8px;line-height:1.5\">“{{ pPrompt }}”<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px\">\n              <sc-for list=\"{{ pMeta }}\" as=\"m\" hint-placeholder-count=\"4\"><div style=\"min-width:0\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">{{ m.k }}<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#0B1220;word-break:break-all\">{{ m.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-right:2px\">Boot · {{ pBootCount }}<\u002Fspan><sc-for list=\"{{ pBoot }}\" as=\"b\" hint-placeholder-count=\"4\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4a5563;background:#f5f6f8;border:1px solid #e3e8ed;border-radius:2px;padding:1px 7px\">{{ b.label }} {{ b.count }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n          <\u002Fheader>\n          <div style=\"padding:8px 14px;border-bottom:1px solid #e3e8ed;font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773\">{{ pSummary }}<\u002Fdiv>\n          <div style=\"padding:4px 14px 14px;max-height:520px;overflow:auto\">\n            <sc-for list=\"{{ pFeed }}\" as=\"r\" hint-placeholder-count=\"10\">\n              <div style=\"display:grid;grid-template-columns:58px 16px minmax(0,1fr);gap:8px;align-items:stretch\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#9aa5b1;text-align:right;padding-top:11px\">{{ r.time }}<\u002Fspan>\n                <span style=\"position:relative\"><span style=\"position:absolute;left:7px;top:0;bottom:0;width:1px;background:#e9edf1\"><\u002Fspan><span style=\"position:absolute;left:3px;top:10px;width:9px;height:9px;border-radius:50%;background:{{ r.dotColor }};border:2px solid #fff;box-sizing:border-box\"><\u002Fspan><\u002Fspan>\n                <div style=\"min-width:0;padding:6px 0\">\n                  <sc-if value=\"{{ r.tailStart }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#9aa5b1;margin:2px 0 8px\">Sandbox teardown after stop<\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ r.isGroup }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;gap:9px;align-items:baseline;opacity:{{ r.dimOpacity }}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:{{ r.catColor }};min-width:72px\">{{ r.count }} × {{ r.catLabel }}<\u002Fspan><span style=\"font-size:12px;color:#5b6773;min-width:0;line-height:1.45\">{{ r.summary }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ r.isSingle }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;gap:9px;align-items:baseline;opacity:{{ r.dimOpacity }}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:{{ r.catColor }};min-width:72px\">{{ r.catLabel }}<\u002Fspan><span style=\"min-width:0\"><span style=\"font-size:12px;color:#0B1220\">{{ r.label }}<\u002Fspan> <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9aa5b1\">{{ r.detail }}<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ r.isDetection }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border:1px solid #F1C7C7;background:#FCF1F1;border-radius:5px;padding:8px 11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#B42318;border-radius:2px;padding:2px 6px\">Detection<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:#0B1220\">{{ r.label }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:{{ r.sevColor }};background:{{ r.sevBg }};border-radius:2px;padding:1px 6px\">{{ r.sev }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#5b6773\">{{ r.owasp }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ r.isBlock }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border:1px solid #F1C7C7;background:#FCF1F1;border-radius:5px;padding:8px 11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#B42318;border:1px solid #E4A9A9;border-radius:2px;padding:2px 6px\">Blocked {{ r.catLabel }}<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#0B1220;min-width:0;word-break:break-all\">{{ r.label }}<\u002Fcode><span style=\"margin-left:auto;font-size:11px;color:#5b6773;white-space:nowrap\">{{ r.reason }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ r.isStop }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border:1px solid #B42318;background:#B42318;border-radius:5px;padding:10px 12px;color:#fff\"><div style=\"display:flex;gap:9px;align-items:center;flex-wrap:wrap\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:#fff;color:#B42318;border-radius:2px;padding:2px 6px\">429 · run stopped<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;font-family:'Space Grotesk',sans-serif\">Budget cap hit — terminated mid-flight<\u002Fspan><\u002Fdiv><div style=\"font-size:11.5px;color:#F6DADA;margin-top:5px;line-height:1.5\">Stopped on “{{ r.label }}” ({{ r.model }}). Events below are teardown, not agent work.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- PROTECT · MCP approvals -->\n  <sc-if value=\"{{ isApprovals }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Control · MCP approvals\" style=\"color:#0B1220\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px\">\n      <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;letter-spacing:.08em\">Control<\u002Fdiv><h1 style=\"font-family:'Space Grotesk',sans-serif;margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em;color:#0B1220\">MCP approvals<\u002Fh1><\u002Fdiv>\n      <div style=\"display:flex;border:1px solid #d5dce3;border-radius:4px;padding:2px\"><button sc-camel-on-click=\"{{ mcpTabPending }}\" style=\"border:0;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:12px;background:{{ mcpPendBg }};color:{{ mcpPendColor }}\">Pending {{ mcpPendingN }}<\u002Fbutton><button sc-camel-on-click=\"{{ mcpTabDecided }}\" style=\"border:0;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:12px;background:{{ mcpDecBg }};color:{{ mcpDecColor }}\">Decided {{ mcpDecidedN }}<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px;color:#5b6773;margin:-6px 0 14px;max-width:720px;line-height:1.5\">Users asked to connect these MCP servers to a tool. A CUE is default-deny, so a server it does not list is blocked. Approving adds the server to the CUE for the tool and group you choose and publishes that as a new signed version.<\u002Fdiv>\n    <sc-if value=\"{{ mcpNotice }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px solid #C9CEFF;background:#ECEEFF;border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;color:#3E48B8;display:flex;gap:10px;align-items:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;color:#4F5BD5\">PROPAGATING<\u002Fspan>{{ mcpNoticeText }}<button sc-camel-on-click=\"{{ mcpUndo }}\" style=\"margin-left:auto;border:0;background:none;color:#4F5BD5;cursor:pointer;font-size:12.5px;font-weight:500\">Undo<\u002Fbutton><\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <sc-for list=\"{{ mcpRows }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <section style=\"background:#fff;border:1px solid #e3e8ed;border-radius:6px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 300px;gap:0\">\n          <div style=\"padding:14px;border-right:1px solid #e3e8ed;min-width:0\">\n            <div style=\"display:flex;gap:8px;align-items:baseline;flex-wrap:wrap\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:#0B1220\">{{ m.name }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773\">{{ m.source }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#4a5563;margin-top:4px;line-height:1.5\">{{ m.desc }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin:12px 0 6px\">Tools requested · {{ m.toolCount }}<\u002Fdiv>\n            <div style=\"display:flex;gap:4px;flex-wrap:wrap\"><sc-for list=\"{{ m.tools }}\" as=\"tl\" hint-placeholder-count=\"3\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid {{ tl.border }};color:{{ tl.color }};border-radius:2px;padding:1px 6px\">{{ tl.name }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n            <sc-if value=\"{{ m.hasWrite }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:#B4530A;margin-top:8px\">Outlined tools can write or delete data.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"padding:14px;border-right:1px solid #e3e8ed;display:flex;flex-direction:column;gap:10px;font-size:12.5px;min-width:0\">\n            <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Requested by<\u002Fdiv>{{ m.user }} <span style=\"color:#5b6773\">· {{ m.roleLabel }}<\u002Fspan><\u002Fdiv>\n            <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Tool<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">{{ m.tool }}<\u002Fspan> <span style=\"color:#5b6773\">on {{ m.host }}<\u002Fspan><\u002Fdiv>\n            <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Waiting<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">{{ m.age }}<\u002Fspan> <span style=\"color:#5b6773\">· {{ m.blocked }} blocked attempts<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12px;color:#5b6773;line-height:1.45;font-style:italic\">\"{{ m.reason }}\"<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px;display:flex;flex-direction:column;gap:8px\">\n            <sc-if value=\"{{ m.pending }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Approve for group<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                <sc-for list=\"{{ m.roleOpts }}\" as=\"sc\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{ 10px;align-items:baseline\">Blast radius <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:400;letter-spacing:.04em;color:#5b6773;border:1px solid #d5dce3;border-radius:2px;padding:1px 6px\">v2<\u002Fspan><\u002Fh1>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goBlast }}\" style=\"border:0;background:none;color:#4F5BD5;cursor:pointer;font-size:12px;padding:0\">Open v1<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px;color:#5b6773;margin-bottom:14px;max-width:760px;line-height:1.5\">Each circle is a group, grant, resource or critical asset. Colour shows risk. Click a node or an edge to see why.<\u002Fdiv>\n\n    <section style=\"background:#fff;border:1px solid #d5dce3;border-radius:6px;padding:12px 14px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2.2fr);gap:16px;align-items:start\">\n      <label style=\"display:flex;flex-direction:column;gap:5px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">1 · Group<\u002Fspan>\n        <sc-raw-select sc-camel-on-change=\"{{ setDsRole }}\" style=\"border:1px solid #d5dce3;border-radius:2px;padding:6px 8px;font-size:12.5px;background:#fff;min-width:0;width:100%\"><sc-for list=\"{{ dsRoleOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.id }}\" selected=\"{{ o.selected }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n        <span style=\"font-size:11.5px;color:#5b6773\">{{ dsRoleNote }}<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:5px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">2 · CUE version<\u002Fspan>\n        <sc-raw-select sc-camel-on-change=\"{{ setDsCue }}\" style=\"border:1px solid #d5dce3;border-radius:2px;padding:6px 8px;font-size:12. ical\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#C4293A\"><\u002Fpath><\u002Fmarker><marker id=\"ar-high\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#E0701B\"><\u002Fpath><\u002Fmarker><marker id=\"ar-medium\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#C9A227\"><\u002Fpath><\u002Fmarker><marker id=\"ar-low\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#b4bdc7\"><\u002Fpath><\u002Fmarker><marker id=\"ar-cut\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#d9b3b8\"><\u002Fpath><\u002Fmarker><marker id=\"ar-sel\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#4F5BD5\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n            <sc-for list=\"{{ gEdges }}\" as=\"e\" hint-placeholder-count=\"10\">\n              <g opacity=\"{{ e.opacity }}\" style=\"transition:opacity .2s\">\n                <path d=\"{{ e.d }}\" fill=\"none\" stroke=\"{{ e.color }}\" stroke-width=\"{{ e.width }}\" stroke-dasharray=\"{{ e.dash }}\" marker-end=\"{{ e.marker }}\" stroke-linecap=\"round\"><\u002Fpath>\n                <path d=\"{{ e.d }}\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" style=\"cursor:pointer\" sc-camel-on-click=\"{{ e.click }}\"><title>{{ e.tip }}<\u002Ftitle><\u002Fpath>\n              <\u002Fg>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <sc-for list=\"{{ gCols }}\" as=\"c\" hint-placeholder-count=\"4\"><div style=\"position:absolute;left:{{ c.left }}px;top:6px;width:180px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:#5b6773\">{{ c.label }}<\u002Fdiv><\u002Fsc-for>\n          <sc-for list=\"{{ gEdges }}\" as=\"e\" hint-placeholder-count=\"0\">\n            <sc-if value=\"{{ e.hasMark }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ e.click }}\" title=\"{{ e.tip }}\" style=\"position:absolute;left:{{ e.markLeft }}px;top:{{ e.markTop }}px;width:18px;height:18px;border-radius:50%;background:#fff;border:1.5px solid {{ e.markColor }};color:{{ e.markColor }};font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:{{ e.opacity }};box-sizing:border-box\">{{ e.mark }}<\u002Fbutton><\u002Fsc-if>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ gNodes }}\" as=\"n\" hint-placeholder-count=\"12\">\n            <div style=\"position:absolute;left:{{ n.lblLeft }}px;top:{{ n.top }}px;width:180px;display:flex;flex-direction:column;align-items:center;opacity:{{ n.opacity }};transition:opacity .2s;pointer-events:none\">\n              <button sc-camel-on-click=\"{{ n.click }}\" title=\"{{ n.tip }}\" style=\"pointer-events:auto;position:relative;width:46px;height:46px;border-radius:50%;background:{{ n.fill }};border:{{ n.ringW }}px solid {{ n.ring }};box-shadow:{{ n.shadow }};cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:{{ n.initColor }};box-sizing:border-box;transition:box-shadow .15s\">{{ n.init }}<sc-if value=\"{{ n.ha lay:inline-flex;align-items:center;justify-content:center;font-weight:600\">2<\u002Fspan>critical assets reached<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:6px;font-size:11px;color:#9aa5b1\">Risk is a sample heuristic: asset sensitivity, plus one level when no policy records the path. Choke points wait on CUE condition data.<\u002Fdiv>\n      <\u002Fsection>\n\n      <aside style=\"flex:1 1 300px;max-width:380px;min-width:280px;background:#fff;border:1px solid #d5dce3;border-radius:6px;position:sticky;top:20px;overflow:hidden\">\n        <sc-if value=\"{{ pOverview }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:14px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773\">Overview<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin:3px 0 12px\">{{ pOpenLine }}<\u002Fdiv>\n            <div style=\"display:flex;height:8px;border-radius:2px;overflow:hidden;margin-bottom:8px\"><sc-for list=\"{{ pRiskBar }}\" as=\"b\" hint-placeholder-count=\"3\"><div style=\"flex:{{ b.n }};background:{{ b.color }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b6773;margin-bottom:16px\"><sc-for list=\"{{ pRiskBar }}\" as=\"b\" hint-placeholder-count=\"3\"><span>{{ b.label }} {{ b.n }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;margin-bottom:6px\">Highest-risk nodes<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <sc-for list=\"{{ pTop }}\" as=\"t\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ t.select }}\" style=\"text-align:left;display:grid;grid-template-columns:12px minmax(0,1f "font-size:12px;color:#5b6773\">Spend cap per user per rolling 24h, set per group. Hard stop ends the turn with a 429; warn only records the overage.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:8px\"><sc-if value=\"{{ capsCustom }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ resetCaps }}\" disabled=\"{{ setRO }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220\">Reset to defaults<\u002Fbutton><\u002Fsc-if><button sc-camel-on-click=\"{{ goBudgetsPage }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:#0B1220\">Open budgets<\u002Fbutton><\u002Fdiv><\u002Fheader>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) 110px 150px minmax(0,1fr);gap:10px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5b6773;border-bottom:1px solid #eef1f4\"><span>Group<\u002Fspan><span>Cap $ / 24h<\u002Fspan><span>When reached<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ capRows }}\" as=\"cr\" hint-placeholder-count=\"9\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) 110px 150px minmax(0,1fr);gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #eef1f4;font-size:12.5px\">\n              <span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ cr.group }}<\u002Fspan>\n              <input type=\"number\" min=\"0\" step=\"0.5\" value=\"{{ cr.cap }}\" sc-camel-on-change=\"{{ cr.setCap }}\" disabled=\"{{ setRO }}\" style=\"border:1px solid #d5dce3;border-radius:2px;padding:5px 7px;font-size:12px;font-family:'JetBrains Mono',monospace;width:100%;box-sizing:border-box;background:#fff\">\n              <sc-raw-select sc-camel-on-change=\"{{ cr.setMode }}\" disabled=\"{{ setRO }}\" style=\"border:1px solid #d5 ce;font-size:11px;color:#5b6773\">{{ u.last }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n\n  <!-- Locked module -->\n  <sc-if value=\"{{ isLocked }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:560px;margin:80px auto;background:#fff;border:1px solid #d5dce3;border-radius:6px;padding:36px 40px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5b6773\">{{ lockedName }} · not in your plan<\u002Fdiv>\n      <h1 style=\"font-family:'Space Grotesk',sans-serif;margin:10px 0 8px;font-size:22px;font-weight:600;letter-spacing:-.01em\">{{ lockedTitle }}<\u002Fh1>\n      <p style=\"margin:0;color:#5b6773;line-height:1.55;font-size:13.5px\">{{ lockedBody }}<\u002Fp>\n      <div style=\"margin:18px 0;padding:12px 14px;background:#f8fafb;border-radius:4px;font-size:12.5px;line-height:1.5\">Your Discover data carries over. {{ lockedBridge }}<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\"><button style=\"border:0;background:#4F5BD5;color:#fff;border-radius:4px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500\">Talk to us about {{ lockedName }}<\u002Fbutton><button sc-camel-on-click=\"{{ goOverview }}\" style=\"border:1px solid #d5dce3;background:#fff;border-radius:4px;padding:8px 14px;cursor:pointer;font-size:13px\">Back to Discover<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:28px;border:1px dashed #c9a227;background:#fdf8e7;border-radius:6px;padding:12px 16px;font-size:12px;color:#5b4d12;line-height:1.55\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase\">Open questions · annotation layer<\u002Fspan><ol style=\"margin:6px 0 0;padding-left:18px\"><li>What is one request: request, flow px;border-bottom:1px solid #e3e8ed\">\n        <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5b6773\">Endpoints<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">{{ ps.endpoints }}<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5b6773\">Requests · {{ windowLabel }}<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">{{ ps.requests }}<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5b6773\">First seen<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">{{ ps.firstSeen }}<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5b6773\">Last seen<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px\">{{ ps.lastSeen }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 20px;border-bottom:1px solid #e3e8ed\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5b6773;margin-bottom:8px\">Governance status<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:3px;font-size:12px;background:{{ ps.chipBg }};color:{{ ps.chipColor }}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px\">{{ ps.icon }}<\u002Fspan>{{ ps.status }}<\u002Fspan><span style=\"font-size:12px;color:#5b6773\">{{ ps.reviewLine }}<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{ canSetStatus }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5b6773;margin-bottom:6px\">Set status<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n            <sc-for list=\"{{ statusOptions }}\" as=\"o\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ o.set }}\" style=\"border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.color }};border-radius:3px;padding:4px 9px;cursor:pointer;font-size:12px;display:inline-flex;gap:6px;align-items:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px\">{{ o.icon }}<\u002Fspan>{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ ps.isProhibited }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;font-size:12px;color:#4a4260;background:#ebe7f3;border-radius:3px;padding:8px 10px\">Protect blocks requests to this service on every enforcing endpoint through block-prohibited-ai. Agents pick up the change on next check-in, usually within 2 minutes.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cannotSetStatus }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;font-size:12px;color:#5b6773\">Viewer role · status is read-only. Administrator or Security roles can set it.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"padding:16px 20px;border-bottom:1px solid #e3e8ed;font-size:12.5px;line-height:1.55;color:#5b6773\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px\">Catalog<\u002Fdiv>\n        <div><span style=\"color:#0B1220\">{{ ps.vendor }}<\u002Fspan> · {{ ps.category }}<sc-if value=\"{{ ps.embedded }}\" hint-placeholder-val=\"{{ false }}\"> · embedded in {{ ps.embeddedIn }}<\u002Fsc-if><\u002Fdiv>\n        <div>{{ ps.blurb }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 20px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5b6773\">Top endpoints · {{ windowLabel }}<\u002Fspan><a href=\"#\" sc-camel-on-click=\"{{ goEndpoints }}\" style=\"font-size:12px\">All endpoints<\u002Fa><\u002Fdiv>\n        <sc-for list=\"{{ ps.top }}\" as=\"e\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ e.open }}\" style=\"width:100%;text-align:left;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid #eef1f4;padding:7px 0;cursor:pointer;font-size:12.5px\"><span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">{{ e.ip }}<\u002Fspan><span style=\"color:#5b6773\"> · {{ e.user }}<\u002Fspan><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid #d5dce3;border-radius:3px;padding:1px 5px;color:#5b6773\">{{ e.type }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">{{ e.requests }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ panelIsEndpoint }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:16px 20px;border-bottom:1px solid #e3e8ed\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5b6773;margin-bottom:8px\">Identity<\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:center;background:#f8fafb;border-radius:4px;padding:12px\">\n          <div style=\"width:38px;height:38px;border-radius:50%;background:{{ pe.avatarBg }};color:{{ pe.avatarColor }};display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;f
