openapi: 3.0.3
info:
  title: RayShield Console API — proposed developer self-service (/api/me/*) and demo-only settings
  version: "2.3.0-proposed"
  license: { name: Proprietary, url: "https://rayshield.example/terms" }
  description: |
    PROPOSED — not in v2.1.0-draft (rayshield-console-api-v1.yml) or v2.2.0-draft
    (rayshield-console-api-v2.2-control.yml). Every operation carries `x-status: proposed`.

    Added for the Straits Meridian Bank demo tenant (fictional) so a developer persona can see their
    own access, blocked events and MCP requests without Control or org-wide read access.
    Scope is always the caller (`sub` in the JWT). Needs two new role claims, `developer` and `ciso`,
    on top of admin | security | viewer (open item).

    Reuses from v2.1.0: bearerAuth, Error, GroupRef, Device, SessionRow, DetectionRow.
servers:
  - url: https://aegis.example.internal:8091
security:
  - bearerAuth: []
x-reuses:
  from_v2_1_0: { schemas: [Error, GroupRef, Device, SessionRow, DetectionRow] }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Workflow:
      type: object
      description: An approval request. Approving runs the same write the approver could make directly, as the approver.
      required: [id, kind, status, title, requested_by, approver_permission]
      properties:
        id: { type: string, example: wf_confluence }
        kind: { type: string, enum: [mcp_access, mcp_decision, mcp_onboard, mcp_remove, cue_publish, group_policy, console_change, budget_exception] }
        kind_label: { type: string }
        status: { type: string, enum: [pending, approved, rejected, returned, withdrawn, stale] }
        title: { type: string, example: confluence MCP server for Engineering — Payments }
        summary: { type: string }
        changes: { type: array, items: { type: string }, description: "what changes if approved, one line each (+ added, − removed, = unchanged)" }
        facts: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
        reason: { type: string, nullable: true }
        requested_by: { type: object, properties: { id: { type: string }, name: { type: string }, role: { type: string } } }
        requested_at: { type: string, format: date-time }
        via: { type: string, nullable: true, enum: [me, terminal, console, null] }
        approver_permission: { type: string, description: "permission the approver must hold (decideMcp, publishCue, removeMcp, …)" }
        approvers: { type: array, items: { type: string } }
        recommendations: { type: array, items: { type: object, properties: { by: { type: string }, recommendation: { type: string, enum: [approve, block] }, note: { type: string, nullable: true } } } }
        history: { type: array, items: { type: object, properties: { by: { type: string }, action: { type: string }, note: { type: string, nullable: true } } } }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        decision_note: { type: string, nullable: true }
        takes_duration: { type: boolean, description: "approving grants MCP access, so the approver picks how long it lasts" }
        asked_duration_minutes: { type: integer, nullable: true }
        can: { type: object, properties: { decide: { type: boolean }, recommend: { type: boolean }, withdraw: { type: boolean }, resubmit: { type: boolean } } }
    Inbox:
      type: object
      properties:
        unread: { type: integer }
        pending_decisions: { type: integer }
        needs_decision: { type: array, items: { $ref: '#/components/schemas/Workflow' } }
        my_requests: { type: array, items: { $ref: '#/components/schemas/Workflow' } }
        updates: { type: array, items: { type: object, properties: { id: { type: string }, at: { type: string, format: date-time }, kind: { type: string, enum: [action, update] }, by: { type: string }, text: { type: string }, workflow_id: { type: string }, read: { type: boolean } } } }
        access_durations: { type: array, items: { type: object, properties: { minutes: { type: integer }, label: { type: string } } } }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, enum: [INVALID_PARAMETER, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, RATE_LIMITED] }
        request_id: { type: string }
    GroupRef:
      type: object
      nullable: true
      properties: { id: { type: string }, name: { type: string } }
    MyAccess:
      type: object
      required: [user, tools, models, mcp_servers, egress_allow, dlp_rules]
      properties:
        user:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
            role: { type: string, enum: [admin, security, ciso, developer, viewer] }
            group: { $ref: '#/components/schemas/GroupRef' }
        tools: { type: array, items: { type: string }, description: "Wrapped agent CLIs on the caller's devices" }
        models: { type: array, items: { type: string } }
        cue:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            version: { type: integer }
            base: { type: string, nullable: true, description: "Base CUE name; inherited fields are locked" }
            pending_draft:
              type: object
              nullable: true
              properties: { version: { type: integer }, adds: { type: array, items: { type: string } }, by: { type: string } }
        mcp_servers: { type: array, items: { type: string }, description: "group MCP policy ∩ CUE, onboarded in the MCP Bridge only" }
        mcp_policy:
          type: object
          nullable: true
          properties: { allow: { type: array, items: { type: string } }, deny: { type: array, items: { type: string } } }
        egress_allow: { type: array, items: { type: string } }
        dlp_rules: { type: array, items: { type: string } }
        budget:
          type: object
          nullable: true
          properties:
            cap_usd: { type: number }
            cap_scope: { type: string, enum: [per_user_24h] }
            mode: { type: string, enum: [hard_stop, warn] }
            spend_today_usd: { type: number, nullable: true }
        writable_mounts_note: { type: string }
    MyMcpRequest:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, description: "MCP Bridge record id" }
        name: { type: string }
        status: { type: string, enum: [scanning, awaiting_decision, approved, blocked] }
        bridge_status: { type: string, enum: [scanning, approved, blocked] }
        reason: { type: string, nullable: true }
        requested_at: { type: integer, format: int64 }
        decided_by: { type: string, nullable: true }
        decided_at: { type: integer, format: int64, nullable: true }
    MyDetection:
      type: object
      description: DetectionRow (v2.1) plus a plain-English explanation and fix.
      properties:
        detection_id: { type: string }
        ts: { type: integer, format: int64 }
        rule_id: { type: string }
        rule_label: { type: string }
        severity: { type: string, enum: [critical, high, medium] }
        disposition: { type: string, enum: [blocked, recorded, escalated] }
        device_id: { type: string }
        host: { type: string }
        owner: { type: string, nullable: true }
        owner_kind: { type: string, enum: [person, service] }
        department: { type: string, nullable: true }
        group: { $ref: '#/components/schemas/GroupRef' }
        session_id: { type: string, nullable: true }
        teaser: { type: string }
        why: { type: string }
        fix_hint: { type: string, nullable: true }
    MyDevice:
      type: object
      description: v2.1 Device plus `os`, filtered to devices the caller owns.
      properties:
        id: { type: string }
        device_name: { type: string }
        agent_state: { type: string, enum: [enforcing, record_only, offline, no_agent] }
        agent_version: { type: string, nullable: true }
        tools: { type: array, items: { type: string } }
        os: { type: string }
        group: { $ref: '#/components/schemas/GroupRef' }
        status: { type: string }
        health_score: { type: integer }
        risk_level: { type: string, enum: [low, medium, high] }
        blocks_24h: { type: integer }
        last_heartbeat: { type: integer, format: int64, nullable: true }
        endpoint_id: { type: string }
        ip: { type: string }
        type: { type: string, enum: [laptop, vm, other] }
        owner: { type: string, nullable: true }
        owner_kind: { type: string, enum: [person, service] }
        department: { type: string, nullable: true }
        allowed: { type: integer }
        blocked: { type: integer }
        recorded: { type: integer }
    MySession:
      type: object
      description: v2.1 SessionRow, filtered to sessions on the caller's devices.
      properties:
        sid: { type: string }
        name: { type: string }
        started: { type: integer, format: int64 }
        host: { type: string }
        tool: { type: string, nullable: true }
        detections: { type: integer }
        outcome: { type: string, enum: [clean, detected, stopped] }
        egress: { type: integer }
        actions: { type: integer }
        prompts: { type: integer }
        dlp: { type: integer }
        rules: { type: integer }
        denies: { type: integer }
        last_seen: { type: integer, format: int64 }
        device_id: { type: string }
        owner: { type: string, nullable: true }
        department: { type: string, nullable: true }
        group: { $ref: '#/components/schemas/GroupRef' }

paths:
  /api/inbox:
    get:
      operationId: listInbox
      x-status: proposed
      x-min-role: self
      summary: Approvals waiting for me, my own requests, and my notices (the mailbox)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Inbox' } } } }
  /api/inbox/read:
    post:
      operationId: markInboxRead
      x-status: proposed
      x-min-role: self
      requestBody: { content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string } }, workflow_id: { type: string } } } } } }
      responses:
        '200': { description: OK }
  /api/workflows:
    post:
      operationId: submitWorkflow
      x-status: proposed
      x-min-role: self
      summary: Ask for something your role cannot do. One open request per subject; asking again attaches to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [mcp_access, mcp_decision, mcp_onboard, mcp_remove, cue_publish, group_policy, console_change, budget_exception] }
                reason: { type: string, maxLength: 300 }
                name: { type: string }
                bridge_id: { type: string }
                group_id: { type: string }
                cue_id: { type: string }
                action: { type: string, enum: [suspend, remove], description: "mcp_remove only" }
                recommendation: { type: string, enum: [approve, block], description: "mcp_decision only" }
                access_ttl_minutes: { type: integer, description: "mcp_access: how long the requester needs it" }
                allow: { type: array, items: { type: string }, description: "group_policy only" }
                slice: { type: string, description: "console_change only" }
                op: { type: string }
                value: { description: "console_change: the full new value of that console area" }
                title: { type: string }
                changes: { type: array, items: { type: string } }
                cap_usd: { type: number, description: "budget_exception only" }
      responses:
        '200': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '400': { description: Invalid, or you can do this directly, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Someone already asked, or it is already decided, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/workflows/{id}:
    get:
      operationId: getWorkflow
      x-status: proposed
      x-min-role: self
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
  /api/workflows/{id}/decision:
    post:
      operationId: decideWorkflow
      x-status: proposed
      x-min-role: admin
      summary: Approve (runs the change as the approver), reject, or send back with a note. The approver must hold the permission the request needs and cannot be the requester.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject, return] }
                note: { type: string, maxLength: 300, description: required when sending back }
                access_ttl_minutes: { type: integer, description: "MCP access grants: 0 = no expiry" }
      responses:
        '200': { description: Decided, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Already decided, or the console area changed since the request (status becomes stale), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/workflows/{id}/recommendation:
    post:
      operationId: recommendWorkflow
      x-status: proposed
      x-min-role: security
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { recommendation: { type: string, enum: [approve, block] }, note: { type: string } } } } } }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
  /api/workflows/{id}/withdraw:
    post:
      operationId: withdrawWorkflow
      x-status: proposed
      x-min-role: self
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Withdrawn, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
  /api/me/access:
    get:
      operationId: getMyAccess
      x-status: proposed
      x-min-role: self
      summary: My tools, models, approved MCP servers, egress, assigned CUE + version and budget
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyAccess' } } } }
  /api/me/mcp-requests:
    get:
      operationId: listMyMcpRequests
      x-status: proposed
      x-min-role: self
      summary: MCP servers I asked for and where each stands
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MyMcpRequest' } } } } }
    post:
      operationId: createMyMcpRequest
      x-status: proposed
      x-min-role: self
      summary: Ask for an MCP server — creates (or attaches to) a Bridge record with status scanning and emits mcpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, reason: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/MyMcpRequest' } } } }
        '400': { description: Invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/me/devices:
    get:
      operationId: listMyDevices
      x-status: proposed
      x-min-role: self
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MyDevice' } } } } }
  /api/me/sessions:
    get:
      operationId: listMySessions
      x-status: proposed
      x-min-role: self
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MySession' } } } } }
  /api/me/detections:
    get:
      operationId: listMyDetections
      x-status: proposed
      x-min-role: self
      summary: My detections (7 days) with why it was blocked and how to fix it
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MyDetection' } } } } }

  # ───── demo-only (settings writes and reset have no operation in v2.1 / v2.2) ─────
  /api/settings/sensors:
    get: { operationId: getSettingsSensors, x-status: proposed, x-min-role: security, summary: Same body as getSensors, responses: { '200': { description: OK } } }
  /api/settings/sensors/{id}:
    put: { operationId: updateSensor, x-status: proposed, x-min-role: admin, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }
  /api/settings/directory:
    get: { operationId: getSettingsDirectory, x-status: proposed, x-min-role: security, responses: { '200': { description: OK } } }
    put: { operationId: updateDirectory, x-status: proposed, x-min-role: admin, responses: { '200': { description: OK }, '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }
  /api/settings/users:
    get: { operationId: listConsoleUsers, x-status: proposed, x-min-role: security, responses: { '200': { description: OK } } }
  /api/settings/users/{id}:
    put: { operationId: updateConsoleUser, x-status: proposed, x-min-role: admin, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }
  /api/demo/reset:
    post: { operationId: resetDemo, x-status: proposed, x-min-role: admin, summary: Demo only — return the tenant to its seed state, responses: { '200': { description: OK }, '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }
  /api/console/state:
    get:
      operationId: getConsoleState
      x-status: proposed
      x-min-role: security
      summary: Demo only — console edits the server has saved (groups, policies, CUEs, settings, device-to-group moves)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved_at: { type: integer, format: int64, nullable: true }
                  slices: { type: object, description: "keyed by area: roles, policies, cues, settings, fleetRoles, bridge, access" }
    post:
      operationId: saveConsoleState
      x-status: proposed
      x-min-role: admin
      summary: Demo only — save one edited console area; checked against the permission that area needs, persisted to live-state.json, pushed to other open consoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slice, value]
              properties:
                slice: { type: string, enum: [roles, policies, cues, settings, fleetRoles, bridge, access] }
                op: { type: string, description: "the action, used to pick the permission (e.g. createGroup vs assignPolicy)" }
                value: { description: "the full new value of that area" }
      responses:
        '200': { description: Saved }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
x-proposed-extensions:
  description: Fields added to v2.2 operations for this tenant; not in rayshield-console-api-v2.2-control.yml.
  decideBridgeMcp:
    request: "access_ttl_minutes (integer) or access_expires_at (date-time) — the group grant expires; suspend: true with status blocked — kill switch that keeps group policy so status approved reinstates it"
    response: "BridgeMcp.suspended, suspended_by, suspended_reason; groups_with_access[].access_expires_at"
  setGroupMcpPolicy:
    request: "expires: { <mcp id or name>: date-time | null }"
    response: "McpPolicy.expires: { <mcp id>: date-time }"
  getMyAccess:
    response: "mcp_access[]: { name, expires_at }; budget.exception: { cap_usd, group_cap_usd, approved_by, expires_at }"
