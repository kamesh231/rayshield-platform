openapi: 3.0.3
info:
  title: RayShield Console API — v1 scope (Home, Discover, Protect, Usage)
  version: "2.1.0-draft"
  license: { name: Proprietary, url: "https://rayshield.example/terms" }
  description: |
    Contract between the RayShield console and aegis-fleet-api for the first release.
    Builds on the existing spec (v2.0.0) — read each operation's `x-status` and description.

    **Scope.** Home, Discover, Protect and Usage. Control (CUEs, groups, MCP approvals, blast
    radius) and Policies are parked: the console does not call those endpoints in v1.

    **Time window.** No time-series in v1. Every read returns an aggregate over the **last 7 days**.
    `from`/`to` are optional (epoch seconds); default `to = now`, `from = to − 7d`. A span longer than
    7 days returns `400` with code `WINDOW_TOO_LARGE`. There is no `bucket` parameter.

    **Additive changes only.** `x-status: extended` means the endpoint exists today; every existing
    field keeps its name and meaning, and the listed fields are added. Nothing is renamed or removed.
    `x-status: new` means the path does not exist yet.

    **Response shape.** Bodies keep today's style (bare arrays or objects). Paging and window metadata
    travel in response headers — see `components/headers`. CORS must list them in
    `Access-Control-Expose-Headers`.

    **Auth.** Every console call needs `Authorization: Bearer <JWT>`. Minimum role per operation is in
    `x-min-role` (viewer < security < admin). Device and sensor ingest tokens cannot call console
    endpoints. Viewer responses are redacted as described in `x-viewer-redaction`.
servers:
  - url: https://aegis.northwind.internal:8091
    description: Pilot — one Aegis Server per customer (hostname to be confirmed per customer)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Console sign-in, token refresh and the current user
  - name: Home
    description: Posture rows and the Needs-attention list
  - name: Discover
    description: AI services, endpoints and sensors observed by Shield (pcap, SASE, DNS, IdP)
  - name: Protect
    description: Fleet, per-device decisions, detections and execution sessions
  - name: Usage
    description: Tokens, cost and budgets for agent sessions

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token, 15-minute lifetime, signed by the Aegis Server (EdDSA or RS256).
        Claims: `sub`, `email`, `name`, `org_id`, `role` (admin | security | viewer),
        `aud` = "rayshield-console", `iat`, `exp`.

  headers:
    X-Window-From: { description: "Window start actually applied (epoch seconds)", schema: { type: integer, format: int64 } }
    X-Window-To: { description: "Window end actually applied (epoch seconds)", schema: { type: integer, format: int64 } }
    X-Data-As-Of: { description: "Newest event timestamp included — drives the freshness banner", schema: { type: integer, format: int64 } }
    X-Next-Cursor: { description: "Opaque cursor for the next page; absent on the last page", schema: { type: string } }
    X-Total-Count: { description: "Rows matching the filters (omit if expensive)", schema: { type: integer } }

  parameters:
    From:
      name: from
      in: query
      required: false
      description: Window start, epoch seconds. Default `to − 7d`. Span may not exceed 7 days.
      schema: { type: integer, format: int64 }
    To:
      name: to
      in: query
      required: false
      description: Window end, epoch seconds. Default now.
      schema: { type: integer, format: int64 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Value of `X-Next-Cursor` from the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, maximum 200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: Invalid parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "The window may not exceed 7 days.", code: WINDOW_TOO_LARGE, request_id: req_7Hc2kQ }
    Unauthorized:
      description: Missing, expired or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "Access token expired.", code: UNAUTHENTICATED, request_id: req_9aB31x }
    Forbidden:
      description: Authenticated, but this role may not do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "Role 'viewer' cannot change governance status.", code: FORBIDDEN, request_id: req_Qm28vd }
    NotFound:
      description: No such resource in this organisation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "No detection with that id.", code: NOT_FOUND, request_id: req_Lx03pa }

  schemas:
    Error:
      type: object
      description: Existing `{ error }` shape plus two additive fields.
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, enum: [WINDOW_TOO_LARGE, INVALID_CURSOR, INVALID_PARAMETER, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, RATE_LIMITED] }
        request_id: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, security, viewer] }
        org: { type: object, properties: { id: { type: string }, name: { type: string } } }

    Link:
      type: object
      description: Where the console navigates when the row is clicked
      properties:
        screen: { type: string, enum: [services, service, endpoints, endpoint, sensors, fleet, device, detections, detection, sessions, session, usage, budgets] }
        params: { type: object, additionalProperties: { type: string } }

    GroupRef:
      type: object
      nullable: true
      description: |
        The console "group". v1 source: the group assignment the backend already holds for the
        device or person (rs_* tables / directory mapping). Null when unknown — the console then
        shows `department`. See doc, decision 2.
      properties:
        id: { type: string }
        name: { type: string, example: "Engineering — EU (canary)" }

    GovernanceStatus:
      type: string
      enum: [approved, unapproved, prohibited, under_review, beta, unlabelled]

    Service:
      type: object
      description: Existing `DiscoveryService` fields (unchanged) plus the additions marked NEW.
      properties:
        ai_service: { type: string, description: "Display name (existing)" }
        category: { type: string }
        icon: { type: string, nullable: true }
        separability: { type: string, description: "distinct | local | embedded" }
        confidence: { type: string }
        hits: { type: integer, format: int64, description: "Requests in the window (existing)" }
        bytes: { type: integer, format: int64 }
        users: { type: integer, format: int64 }
        risk_score: { type: integer }
        jurisdiction: { type: string }
        ever_agentic: { type: boolean }
        sandbox_candidate: { type: boolean }
        agent_sdks: { type: string, nullable: true }
        collector_count: { type: integer, format: int64 }
        first_seen: { type: integer, format: int64 }
        last_seen: { type: integer, format: int64 }
        personal_account: { type: boolean }
        oauth_scopes: { type: string, nullable: true }
        service_id: { type: string, description: "NEW — stable catalog key, e.g. perplexity" }
        vendor: { type: string, description: NEW }
        embedded_in: { type: string, nullable: true, description: "NEW — sanctioned SaaS it is embedded in (HubSpot, Notion…)" }
        status: { $ref: '#/components/schemas/GovernanceStatus' }
        reviewed_by: { type: string, nullable: true, description: NEW }
        reviewed_at: { type: integer, format: int64, nullable: true, description: NEW }
        endpoints: { type: integer, description: "NEW — distinct endpoints in the window" }
        is_new: { type: boolean, description: "NEW — first_seen falls inside the window" }

    DiscoveryEndpoint:
      type: object
      description: Existing `by_endpoint` fields (unchanged) plus the additions marked NEW.
      properties:
        endpoint: { type: string, description: "src_ip (existing)" }
        host: { type: string, nullable: true }
        hits: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        services: { type: integer, format: int64 }
        endpoint_id: { type: string, description: "NEW — stable id, identical in Discover and Protect" }
        device_id: { type: string, nullable: true, description: "NEW — Aegis device id when an agent is installed" }
        type: { type: string, enum: [laptop, vm, other], description: NEW }
        ephemeral: { type: boolean, description: NEW }
        user: { type: string, nullable: true, description: "NEW — directory identity" }
        department: { type: string, nullable: true, description: NEW }
        identity_source: { type: string, nullable: true, enum: [idp, vpn_logon, mdm, dhcp, null], description: "NEW — how user/department were resolved" }
        sensor: { type: string, description: "NEW — sensor that saw it most, e.g. pcap" }
        first_seen: { type: integer, format: int64, description: NEW }
        last_seen: { type: integer, format: int64, description: NEW }

    Device:
      type: object
      description: Existing `Device` fields (unchanged) plus the additions marked NEW.
      properties:
        id: { type: string, format: uuid }
        device_name: { type: string, description: "Hostname (existing)" }
        status: { type: string }
        health_score: { type: integer }
        risk_level: { type: string, enum: [low, medium, high] }
        blocks_24h: { type: integer, format: int64 }
        last_heartbeat: { type: integer, format: int64 }
        endpoint_id: { type: string, description: NEW }
        ip: { type: string, description: NEW }
        type: { type: string, enum: [laptop, vm, other], description: NEW }
        owner: { type: string, nullable: true, description: NEW }
        owner_kind: { type: string, enum: [person, service], description: NEW }
        department: { type: string, nullable: true, description: NEW }
        group: { $ref: '#/components/schemas/GroupRef' }
        agent_state: { type: string, enum: [enforcing, record_only, offline, no_agent], description: "NEW — offline = no heartbeat for 10 min" }
        agent_version: { type: string, nullable: true, description: NEW }
        tools: { type: array, items: { type: string }, description: "NEW — wrapped agent CLIs seen, e.g. claude-code" }
        allowed: { type: integer, format: int64, description: "NEW — decisions in the window" }
        blocked: { type: integer, format: int64, description: "NEW — decisions in the window" }
        recorded: { type: integer, format: int64, description: "NEW — decisions in the window" }

    DeviceEvent:
      type: object
      description: Existing `Decision` fields (unchanged) plus the additions marked NEW.
      properties:
        id: { type: string, format: uuid }
        ts: { type: integer, format: int64 }
        identity: { type: string }
        device: { type: string }
        app: { type: string, nullable: true, description: "AI service or destination (existing)" }
        action: { type: string, enum: [tool call, prompt, network, detection, action] }
        target: { type: string }
        source: { type: string, enum: [sandbox, host, unlabelled] }
        decision: { type: string, enum: [allow, block, record], description: "Existing field; values made explicit" }
        reason: { type: string, nullable: true }
        rule_id: { type: string, nullable: true }
        session_id: { type: string, nullable: true, description: NEW }
        tool: { type: string, nullable: true, description: "NEW — e.g. claude-code" }
        channel: { type: string, enum: [agent, browser_app], description: "NEW — the UI's 'via Claude Code' vs 'browser or app'" }
        enforced_by: { type: string, nullable: true, enum: [cue, dlp, detector, null], description: "NEW — what produced a block or record" }

    Severity:
      type: string
      enum: [critical, high, medium]

    Disposition:
      type: string
      enum: [blocked, recorded, escalated]

    DetectionFamily:
      type: object
      properties:
        rule_id: { type: string, example: SENSITIVE-ACCESS }
        label: { type: string }
        description: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        owasp: { type: string, example: ASI04, description: "OWASP Top 10 for Agentic Applications id" }
        signal: { type: string, enum: [wire, guest] }
        hits: { type: integer }
        devices: { type: integer }
        groups: { type: integer }
        blocked: { type: integer }
        recorded: { type: integer }
        escalated: { type: integer }

    DetectionRow:
      type: object
      properties:
        detection_id: { type: string }
        ts: { type: integer, format: int64 }
        rule_id: { type: string }
        rule_label: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        disposition: { $ref: '#/components/schemas/Disposition' }
        device_id: { type: string }
        host: { type: string }
        owner: { type: string, nullable: true }
        owner_kind: { type: string, enum: [person, service] }
        department: { type: string, nullable: true }
        group: { $ref: '#/components/schemas/GroupRef' }
        session_id: { type: string, nullable: true }
        teaser: { type: string, description: "One line, already redacted. For viewer: rule label and target type only." }

    Evidence:
      type: object
      description: |
        One shape per `type`; the other keys are null. Secrets are redacted server-side before the
        response leaves the API. For viewer, every key except `type` is null.
      properties:
        type: { type: string, enum: [decoded_command, sensitive_content, exfil, egress_spike, persistence, undisclosed_action] }
        decoded_command:
          type: object
          nullable: true
          properties: { encoding: { type: string, enum: [base64, hex, none] }, decoded_redacted: { type: string }, where: { type: string } }
        sensitive_content:
          type: object
          nullable: true
          properties: { path: { type: string }, basis: { type: string }, pattern: { type: string }, snippet_redacted: { type: string } }
        exfil:
          type: object
          nullable: true
          properties: { destination: { type: string }, bytes: { type: integer, format: int64 }, classification: { type: string } }
        egress_spike:
          type: object
          nullable: true
          properties: { destination: { type: string }, multiple_of_baseline: { type: number }, baseline_bytes_per_5min: { type: integer } }
        persistence:
          type: object
          nullable: true
          properties: { mechanism: { type: string }, artifact: { type: string } }
        undisclosed_action:
          type: object
          nullable: true
          properties: { declared: { type: integer }, observed: { type: integer }, undeclared: { type: integer }, declared_list: { type: array, items: { type: string } }, observed_extra: { type: array, items: { type: string } } }

    DetectionDetail:
      allOf:
        - $ref: '#/components/schemas/DetectionRow'
        - type: object
          properties:
            description: { type: string }
            owasp: { type: string }
            signal: { type: string, enum: [wire, guest] }
            classification: { type: string, nullable: true }
            backend: { type: string, example: "aegis-engine 0.9.4" }
            evidence: { $ref: '#/components/schemas/Evidence' }
            chain:
              type: array
              description: Neighbouring events in the same session, oldest first. `detail` is null for viewer.
              items:
                type: object
                properties:
                  ts: { type: integer, format: int64 }
                  label: { type: string }
                  detail: { type: string, nullable: true }
                  is_current: { type: boolean }
                  is_detection: { type: boolean }
                  severity: { $ref: '#/components/schemas/Severity' }
                  disposition: { $ref: '#/components/schemas/Disposition' }
            signature:
              type: object
              description: The existing evidence `signature` is a string; this object is new.
              properties:
                alg: { type: string, example: ed25519 }
                key_id: { type: string }
                value: { type: string }
                signed_at: { type: integer, format: int64 }
                verify_hint: { type: string, example: "aegis verify <event_id>" }

    SessionRow:
      type: object
      description: Existing `/api/sessions` fields (unchanged) plus the additions marked NEW.
      properties:
        sid: { type: string }
        name: { type: string }
        egress: { type: integer }
        actions: { type: integer }
        prompts: { type: integer }
        dlp: { type: integer }
        rules: { type: integer }
        denies: { type: integer }
        started: { type: integer, format: int64 }
        last_seen: { type: integer, format: int64 }
        device_id: { type: string, description: NEW }
        host: { type: string, description: NEW }
        owner: { type: string, nullable: true, description: NEW }
        department: { type: string, nullable: true, description: NEW }
        group: { $ref: '#/components/schemas/GroupRef' }
        tool: { type: string, nullable: true, description: NEW }
        detections: { type: integer, description: NEW }
        outcome: { type: string, enum: [clean, detected, stopped], description: "NEW — stopped = budget hard-stop" }

paths:
  # ─────────────────────────────── Auth ───────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in (pilot, email + password). OIDC SSO replaces this later without changing other calls.
      x-status: new
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string, format: password } }
            example: { email: "priya.nair@northwind.example", password: "••••••••" }
      responses:
        '200':
          description: Signed in. A refresh token is also set as an HttpOnly, Secure, SameSite=Strict cookie.
          headers:
            Set-Cookie: { schema: { type: string }, example: "rs_refresh=…; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=28800" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 900 }
                  user: { $ref: '#/components/schemas/User' }
              example:
                access_token: "eyJhbGciOiJFZERTQSIsImtpZCI6ImF1dGgtMjAyNi0wOSJ9.eyJzdWIiOiJ1c3JfMDFKOSIsIm9yZ19pZCI6Im9yZ19ub3J0aHdpbmQiLCJyb2xlIjoiYWRtaW4ifQ.c2ln"
                token_type: Bearer
                expires_in: 900
                user: { id: usr_01J9, name: Priya Nair, email: priya.nair@northwind.example, role: admin, org: { id: org_northwind, name: Northwind Capital } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: "Too many attempts — lock for 15 minutes after 5 failures" }

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Exchange the refresh cookie for a new access token (the refresh token rotates)
      x-status: new
      security: []
      responses:
        '200':
          description: New access token
          content:
            application/json:
              example: { access_token: "eyJ…", token_type: Bearer, expires_in: 900 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the refresh token and clear the cookie
      x-status: new
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user and role — the console shows or hides actions from this
      x-status: new
      x-min-role: viewer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: usr_01J9, name: Priya Nair, email: priya.nair@northwind.example, role: admin, org: { id: org_northwind, name: Northwind Capital } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────────── Home ───────────────────────────────
  /api/home:
    get:
      tags: [Home]
      operationId: getHome
      summary: Home rows per plane plus the Needs-attention list (also feeds the Discover overview list)
      description: |
        The console uses this instead of `/api/posture`, `/api/risks/top` and `/api/whatsnew`.
        No Control rows in v1. Attention items are derived from the same data as the Discover and
        Protect endpoints, newest first, maximum 10. `plane=discover` returns only Discover items
        (for the attention list on the Discover overview).
        Suggested attention rules: service first seen in window with no status; activity on a
        prohibited service; escalated detection; critical detection; sensor silent > 2 h;
        agents offline.
      x-status: new
      x-min-role: viewer
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: plane, in: query, required: false, schema: { type: string, enum: [discover, protect] } }
      responses:
        '200':
          description: OK
          headers:
            X-Window-From: { $ref: '#/components/headers/X-Window-From' }
            X-Window-To: { $ref: '#/components/headers/X-Window-To' }
            X-Data-As-Of: { $ref: '#/components/headers/X-Data-As-Of' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  planes:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, enum: [Discover, Protect] }
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              label: { type: string }
                              value: { type: integer }
                              total: { type: integer, nullable: true }
                              link: { $ref: '#/components/schemas/Link' }
                  attention:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [discover, protect, usage, system] }
                        severity: { type: string, enum: [info, warning, critical] }
                        text: { type: string }
                        meta: { type: string, nullable: true, example: "4 endpoints" }
                        ts: { type: integer, format: int64 }
                        link: { $ref: '#/components/schemas/Link' }
              example:
                planes:
                  - name: Discover
                    rows:
                      - { key: services_detected, label: "AI services detected", value: 24, total: null, link: { screen: services, params: {} } }
                      - { key: services_unlabelled, label: "Awaiting a governance decision", value: 3, total: null, link: { screen: services, params: { status: unlabelled } } }
                      - { key: endpoints_using_ai, label: "Endpoints using AI", value: 133, total: null, link: { screen: endpoints, params: {} } }
                  - name: Protect
                    rows:
                      - { key: agents_enforcing, label: "Endpoints with an enforcing agent", value: 118, total: 133, link: { screen: fleet, params: { agent_state: enforcing } } }
                      - { key: detections, label: "Detections", value: 61, total: null, link: { screen: detections, params: {} } }
                      - { key: detections_escalated, label: "Escalated to a human", value: 4, total: null, link: { screen: detections, params: { disposition: escalated } } }
                attention:
                  - { kind: discover, severity: warning, text: "New AI service detected: Perplexity · no governance status yet", meta: "4 endpoints", ts: 1790403161, link: { screen: service, params: { service_id: perplexity } } }
                  - { kind: protect, severity: critical, text: "Critical detection on vm-ci-build-214 · escalated", meta: "Data exfiltration", ts: 1790409482, link: { screen: detection, params: { detection_id: det_01J9Z8M7TQ } } }
                  - { kind: system, severity: warning, text: "Sensor sase_zscaler has sent no data for 2 h 40 m", meta: null, ts: 1790401800, link: { screen: sensors, params: {} } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Discover ─────────────────────────────
  /api/discovery/summary:
    get:
      tags: [Discover]
      operationId: getDiscoverySummary
      summary: Overview tiles
      description: |
        Existing fields unchanged: `services`, `users`, `departments`, `bytes`, `hits`, `agent_alerts`.
        Added: `new_services`, `embedded_services`, `endpoints` (by type), `governance` (count per
        status), `unreviewed`, `unreviewed_new`, `shadow_share_pct`, and `previous` (same numbers for
        the previous 7 days, for the "vs previous" deltas — the same comparison `/api/discovery/changes`
        already does). `shadow_share_pct` = hits to unapproved + prohibited + unlabelled ÷ all hits.
      x-status: extended
      x-min-role: viewer
      parameters: [ { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' } ]
      responses:
        '200':
          description: OK
          headers:
            X-Window-From: { $ref: '#/components/headers/X-Window-From' }
            X-Window-To: { $ref: '#/components/headers/X-Window-To' }
            X-Data-As-Of: { $ref: '#/components/headers/X-Data-As-Of' }
          content:
            application/json:
              example:
                services: 24
                users: 96
                departments: 9
                bytes: 3812004211
                hits: 48210
                agent_alerts: 5
                new_services: 2
                embedded_services: 6
